<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>At Last — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (compat build — simplest for a plain script tag, no bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#4A3B63;
    --panel:rgba(255,255,255,.82);
    --panel-2:rgba(255,255,255,.6);
    --tile:#FFFFFF;
    --tile-ink:#4A3B63;
    --pink:#FF6FB5;
    --orange:#FFB259;
    --yellow:#FFDD5C;
    --mint:#5FE0B7;
    --sky:#5EC4F0;
    --violet:#A78BFA;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet); /* legacy var still referenced in places */
    --teal:var(--sky);
    --brick:#E8577A;
    --sage:#3FAE85;
    --text:#4A3B63;
    --text-muted:#6E6191;
    --line:#E7DFF7;
    --border:#E7DFF7;
    --text-scale:1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, #FFE3F3 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #E1F3FF 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #E9FFF3 0%, transparent 50%),
      linear-gradient(160deg,#FCEFFF 0%,#EFEBFF 35%,#E9F6FF 70%,#EFFFF6 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{ font-family:'Baloo 2',cursive; font-weight:700; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ---------- layout shells ---------- */
  .screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 100px; }
  .screen.play-screen{ padding:12px 14px 90px; min-height:auto; }
  .wrap{ width:100%; max-width:640px; }

  /* ---------- title ---------- */
  .title-block{ text-align:center; margin:24px 0 32px; }
  .title-block h1{ font-size:calc(48px * var(--text-scale)); line-height:1.05; letter-spacing:-.01em; color:var(--ink); }
  .title-block h1 .thread{
    background:var(--rainbow); -webkit-background-clip:text; background-clip:text; color:transparent;
    font-style:normal; font-weight:800;
  }
  .title-block p{ color:var(--text-muted); margin-top:10px; font-size:calc(15px * var(--text-scale)); font-weight:600; }

  .mini-logo{ text-align:center; font-size:calc(22px * var(--text-scale)); font-weight:800; letter-spacing:-.01em; color:var(--ink); margin-bottom:16px; }
  .mini-logo .thread{
    background:var(--rainbow); -webkit-background-clip:text; background-clip:text; color:transparent;
    font-style:normal; font-weight:800;
  }

  /* ---------- cards / panels ---------- */
  .panel{
    background:var(--panel); border:1px solid rgba(255,255,255,.9); border-radius:22px;
    padding:22px; margin-bottom:16px; backdrop-filter:blur(6px);
    box-shadow:0 8px 30px -12px rgba(122,90,190,.25);
  }
  .panel h2{ font-size:calc(15px * var(--text-scale)); text-transform:uppercase; letter-spacing:.06em; color:var(--violet); margin-bottom:14px; font-family:'Baloo 2',cursive; font-weight:700;}

  /* ---------- buttons ---------- */
  button{ font-family:'Nunito',sans-serif; cursor:pointer; border:none; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 20px; border-radius:999px; font-weight:800; font-size:calc(15px * var(--text-scale));
    transition:transform .08s ease, opacity .15s ease, box-shadow .15s ease; width:100%;
  }
  .btn:active{ transform:scale(.97); }
  .btn-gold{ background:var(--rainbow); color:#3B2A57; box-shadow:0 8px 20px -8px rgba(167,139,250,.6); }
  .btn-gold:hover{ box-shadow:0 10px 26px -8px rgba(167,139,250,.8); }
  .btn-outline{ background:#FFFFFFCC; color:var(--ink); border:2px solid var(--violet); }
  .btn-outline:hover{ background:#FFFFFF; }
  .btn-sage{ background:var(--sage); color:#fff; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; }
  .btn-small{ padding:9px 14px; font-size:calc(13px * var(--text-scale)); border-radius:999px; width:auto; }

  /* ---------- setup screen ---------- */
  .stepper{ display:flex; align-items:center; justify-content:center; gap:18px; margin:8px 0 6px; }
  .stepper button{
    width:calc(46px * var(--text-scale)); height:calc(46px * var(--text-scale)); border-radius:50%; background:#FFFFFFD0;
    color:var(--violet); font-size:calc(22px * var(--text-scale)); border:2px solid var(--border); font-weight:800;
  }
  .stepper .count{ font-family:'Baloo 2',cursive; font-size:calc(40px * var(--text-scale)); min-width:calc(54px * var(--text-scale)); text-align:center; color:var(--ink); }
  .name-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .name-row .dot{ width:10px; height:10px; border-radius:50%; background:var(--rainbow); flex-shrink:0; }
  .name-row input{
    flex:1; min-width:0; background:#FFFFFFCC; border:2px solid var(--border); border-radius:12px;
    padding:10px 12px; color:var(--text); font-size:calc(14px * var(--text-scale)); font-family:'Nunito',sans-serif; font-weight:600;
  }
  .name-row input:focus{ outline:none; border-color:var(--violet); }

  /* ---------- pass-device gate ---------- */
  .gate{ text-align:center; padding:60px 20px; }
  .gate .thread-icon{ font-size:calc(52px * var(--text-scale)); margin-bottom:18px; }
  .gate .thread-icon.waiting-pulse{ animation:waitingPulse 1.8s ease-in-out infinite; }
  @keyframes waitingPulse{
    0%,100%{ transform:scale(1); opacity:.85; }
    50%{ transform:scale(1.12); opacity:1; }
  }
  .waiting-label{ opacity:.9; animation:waitingFade 1.8s ease-in-out infinite; }
  @keyframes waitingFade{
    0%,100%{ opacity:.75; }
    50%{ opacity:1; }
  }
  .waiting-dots span{ display:inline-block; animation:waitingDot 1.4s infinite; opacity:.2; }
  .waiting-dots span:nth-child(1){ animation-delay:0s; }
  .waiting-dots span:nth-child(2){ animation-delay:.2s; }
  .waiting-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes waitingDot{
    0%,60%,100%{ opacity:.2; }
    30%{ opacity:1; }
  }
  .gate h2{ font-size:calc(24px * var(--text-scale)); margin-bottom:8px; color:var(--text-muted); text-transform:none; letter-spacing:0; font-family:'Nunito',sans-serif; font-weight:700; }
  .gate p{ color:var(--text-muted); font-size:calc(14px * var(--text-scale)); margin-bottom:26px; font-weight:600; }
  .gate-name{ font-size:calc(34px * var(--text-scale)); margin-bottom:18px; }
  .last-play-block{ margin:0 0 26px; }
  .last-play-label{ font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .last-play-row{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }

  /* ---------- game board ---------- */
  .board-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .board-top .who{ font-family:'Baloo 2',cursive; font-size:calc(20px * var(--text-scale)); color:var(--ink); }
  .clock-badge{
    font-family:'IBM Plex Mono',monospace; font-weight:800; font-size:calc(13px * var(--text-scale));
    padding:6px 12px; border-radius:999px; background:#FFFFFFCC; border:2px solid var(--border); color:var(--ink);
    flex-shrink:0;
  }
  .clock-badge.low{ background:var(--brick); border-color:var(--brick); color:#fff; }
  .board-top .deck-count{ font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); text-align:right; line-height:1.4;}
  .deck-count-line{ font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); text-align:center; margin-top:2px; margin-bottom:10px; letter-spacing:.02em; }
  .score-strip{ font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); text-align:center; margin-bottom:10px; letter-spacing:.02em; }
  .cpu-toggle{ display:flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-weight:700; white-space:nowrap; flex-shrink:0; }
  .cpu-toggle input{ width:15px; height:15px; accent-color:var(--violet); flex-shrink:0; }
  .score-strip b{ color:var(--violet); }
  .scoreboard-row{ display:flex; justify-content:space-between; padding:7px 0; font-weight:700; font-size:calc(15px * var(--text-scale)); border-bottom:1px solid var(--line); }
  .cards-row{ padding:9px 0; border-bottom:1px solid var(--line); }
  .cards-row-name{ font-weight:700; font-size:calc(15px * var(--text-scale)); }
  .cards-row-stats{ font-size:calc(13px * var(--text-scale)); color:var(--text-muted); font-weight:600; margin-top:3px; }
  .words-log{ max-height:260px; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px; }
  .words-log .cards-row:last-child{ border-bottom:none; }
  .words-log-top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .words-log-points{ flex-shrink:0; color:var(--violet); font-size:calc(13px * var(--text-scale)); font-weight:700; }
  .history-trigger-row{ text-align:center; margin:4px 0 18px; }
  .history-trigger-row .status-chip{ width:auto; display:inline-flex; padding:9px 20px; }
  .stat-mini-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:14px; }
  .stat-mini{ text-align:center; background:#FFFFFFCC; border:2px solid var(--border); border-radius:12px; padding:12px 6px; }
  .stat-mini .num{ font-family:'Baloo 2',cursive; font-size:calc(24px * var(--text-scale)); color:var(--violet); line-height:1.1; }
  .stat-mini .lbl{ font-family:'IBM Plex Mono',monospace; font-size:calc(10px * var(--text-scale)); text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-top:4px; }
  .scoreboard-row:last-child{ border-bottom:none; }
  .scoreboard-row .pts{ font-family:'IBM Plex Mono',monospace; color:var(--violet); }

  .core-zone{ display:flex; flex-direction:column; align-items:center; padding:8px 0 4px; }
  .core-card{
    width:calc(62px * var(--text-scale)); height:calc(80px * var(--text-scale)); border-radius:14px; background:var(--tile); color:var(--tile-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
    font-size:calc(34px * var(--text-scale)); font-weight:700; position:relative; transition:transform .15s ease;
    box-shadow:0 0 0 4px transparent, 0 10px 22px -10px rgba(122,90,190,.45);
    background-image:linear-gradient(#fff,#fff), var(--rainbow);
    background-origin:border-box; background-clip:padding-box, border-box;
    border:3px solid transparent; cursor:pointer;
  }
  .core-card:active{ transform:scale(.94); }
  .core-card.wild-core{ background-image:linear-gradient(155deg,#fff 0%, #FFF5FC 100%), var(--rainbow); color:var(--violet); }
  .core-card.pulse{ animation:corepulse .5s ease !important; }
  @keyframes corepulse{ 0%{transform:scale(.7) rotate(-4deg); opacity:0;} 60%{transform:scale(1.08) rotate(2deg);} 100%{transform:scale(1) rotate(0);} }
  .core-card.core-shake{ animation:shakeword .5s ease !important; box-shadow:0 0 0 4px var(--brick), 0 10px 22px -10px rgba(122,90,190,.45); border-color:var(--brick); }
  .core-sparkle{
    position:absolute; pointer-events:none; font-size:16px; animation:sparklefloat .55s ease-out forwards;
  }

  @keyframes shakeword{
    0%,100%{ transform:translateX(0); }
    15%{ transform:translateX(calc(-10px * var(--text-scale))) rotate(-2deg); }
    30%{ transform:translateX(calc(9px * var(--text-scale))) rotate(2deg); }
    45%{ transform:translateX(calc(-7px * var(--text-scale))) rotate(-1.5deg); }
    60%{ transform:translateX(calc(6px * var(--text-scale))) rotate(1deg); }
    75%{ transform:translateX(calc(-4px * var(--text-scale))); }
    90%{ transform:translateX(calc(2px * var(--text-scale))); }
  }
  .builder-row.shake{ animation:shakeword .5s ease; border-color:var(--brick); }
  .builder-row.shake .btile{ box-shadow:0 0 0 2px var(--brick); }

  @keyframes successpop{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.12) rotate(-1deg); }
    55%{ transform:scale(0.97) rotate(1deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  .builder-row.success{ animation:successpop .55s cubic-bezier(.34,1.56,.64,1); border-color:var(--mint); border-style:solid; }
  .builder-row.success .btile{
    animation:successpop .55s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 0 0 2px var(--sage), 0 4px 14px -4px rgba(95,224,183,.7);
  }
  .success-sparkle{
    position:absolute; pointer-events:none; font-size:16px; animation:sparklefloat .55s ease-out forwards;
  }
  @keyframes sparklefloat{
    0%{ opacity:1; transform:translateY(0) scale(0.6); }
    100%{ opacity:0; transform:translateY(-24px) scale(1.2); }
  }
  .core-thread{ width:44px; height:4px; border-radius:6px; background:var(--rainbow); opacity:.75; margin-top:3px; }

  /* builder */
  .row-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:8px; }
  .row-header h2{ font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em; margin:0; }
  .word-status{ font-size:calc(11px * var(--text-scale)); font-weight:700; font-family:'IBM Plex Mono',monospace; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn-tiny{ padding:5px 10px !important; font-size:calc(11px * var(--text-scale)) !important; border-radius:999px; width:auto !important; }
  .builder-zone{ margin:6px 0 4px; }
  .builder-row{
    min-height:72px; border-radius:14px; border:2px dashed var(--border);
    display:flex; align-items:center; gap:6px; padding:8px; flex-wrap:wrap;
    background:var(--panel-2); position:relative;
  }
  .builder-row.empty::before{ content:"Tap letters below or the Core Card, to build your word"; color:var(--text-muted); font-size:calc(12px * var(--text-scale)); font-family:'Nunito',sans-serif; font-weight:600;}
  .btile{
    border-radius:10px; background:var(--tile); color:var(--tile-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
    font-weight:700; position:relative; flex-shrink:0; border:3px solid var(--border);
  }
  .builder-row .btile, .last-play-row .btile{
    width:calc((100% - 42px)/8 * var(--text-scale)); max-width:calc(44px * var(--text-scale)); aspect-ratio:44/52;
    font-size:clamp(calc(15px * var(--text-scale)), calc(5.2vw * var(--text-scale)), calc(24px * var(--text-scale)));
  }
  .btile.core-tile{ box-shadow:0 0 0 3px var(--violet); }
  .btile.wild-tile{
    color:var(--violet); border:3px solid transparent;
    background-image:linear-gradient(#fff,#fff), var(--rainbow);
    background-origin:border-box; background-clip:padding-box, border-box;
  }
  .builder-row .btile{ cursor:pointer; }
  .builder-row .btile:active{ transform:scale(.9); opacity:.75; }

  .hand-zone{ margin-top:8px; }
  .hand-zone h2{ font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .hand-row{ display:flex; gap:6px; flex-wrap:wrap; padding:2px 0 4px; }
  .htile{
    width:calc(44px * var(--text-scale)); height:calc(52px * var(--text-scale)); border-radius:10px; background:var(--tile); color:var(--tile-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
    font-size:calc(24px * var(--text-scale)); font-weight:700; flex-shrink:0; transition:transform .1s ease, opacity .15s;
    border:3px solid var(--border);
  }
  .htile:active{ transform:translateY(2px); }
  .htile.wild{
    color:var(--violet); border:3px solid transparent;
    background-image:linear-gradient(#fff,#fff), var(--rainbow);
    background-origin:border-box; background-clip:padding-box, border-box;
  }
  .htile.used{ opacity:.25; pointer-events:none; }

  .loadout-row{ display:flex; gap:10px; margin-top:8px; }
  .loadout-chip{
    display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px;
    background:#FFFFFFCC; border:2px solid var(--border); font-size:calc(12px * var(--text-scale)); color:var(--text-muted);
    font-family:'Nunito',sans-serif; font-weight:700;
  }
  .loadout-chip .swatch{ width:14px; height:14px; border-radius:5px; background:var(--rainbow); }
  .loadout-chip.spent{ opacity:.35; text-decoration:line-through; }

  .action-bar{ display:flex; gap:8px; margin-top:10px; }

  .status-toggle-row{ display:flex; gap:8px; margin-top:16px; }
  .status-chip{
    flex:1; background:#FFFFFFCC; color:var(--text-muted); border:2px solid var(--border);
    border-radius:999px; padding:9px 14px; font-size:calc(12px * var(--text-scale)); font-weight:800;
    font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;
  }
  .status-chip:active{ transform:scale(.97); }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#FFFFFFF2; border:2px solid var(--violet); color:var(--ink);
    padding:12px 18px; border-radius:14px; font-size:calc(13px * var(--text-scale)); font-weight:700; max-width:90%; text-align:center;
    box-shadow:0 8px 24px rgba(122,90,190,.35); z-index:50;
  }

  .winscreen{ text-align:center; padding:0 20px 80px; position:relative; }
  .winscreen h1{
    font-size:calc(42px * var(--text-scale)); margin-bottom:10px; background:var(--rainbow); -webkit-background-clip:text;
    background-clip:text; color:transparent;
    animation:winnerTitlePop .6s cubic-bezier(.34,1.56,.64,1);
  }
  .winscreen .thread-icon{ font-size:calc(56px * var(--text-scale)); margin-bottom:20px; animation:winnerIconSpin .7s cubic-bezier(.34,1.56,.64,1); }

  @keyframes winnerTitlePop{
    0%{ transform:scale(.6); opacity:0; }
    60%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  @keyframes winnerIconSpin{
    0%{ transform:scale(.3) rotate(-30deg); opacity:0; }
    60%{ transform:scale(1.15) rotate(8deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); }
  }

  .winner-sparkles{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .winner-sparkle{
    position:absolute; top:-40px; font-size:22px; opacity:0;
    animation-name:winnerSparkleFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes winnerSparkleFall{
    0%{ transform:translateY(0) rotate(0deg) scale(.6); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg) scale(1); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .winner-sparkles{ display:none; } }

  .letterpicker{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:12px; }
  .letterpicker button{
    background:#FFFFFFD0; border:2px solid var(--border); color:var(--ink);
    border-radius:10px; font-family:'Fredoka',sans-serif; font-weight:700; font-size:calc(20px * var(--text-scale));
    aspect-ratio:1/1; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .letterpicker button:hover{ border-color:var(--violet); }
  .letterpicker button.wildback-btn{
    grid-column:span 2; aspect-ratio:auto; background:var(--violet); color:#FFF; border-color:var(--violet);
    font-size:calc(16px * var(--text-scale));
  }
  .letterpicker button.wildback-btn:hover{ background:var(--violet); opacity:.9; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(74,59,99,.45); display:flex; align-items:center;
    justify-content:center; z-index:60; padding:20px;
  }
  .modal{
    background:#FFF; border:1px solid var(--border); border-radius:20px; padding:32px 24px; max-width:380px; width:100%;
    box-shadow:0 20px 50px -15px rgba(74,59,99,.4);
    max-height:calc(100vh - 40px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal h3{ font-size:calc(19px * var(--text-scale)); margin-bottom:10px; color:var(--ink); }
  .modal p{ color:var(--text-muted); font-size:calc(14px * var(--text-scale)); margin-bottom:16px; line-height:1.5; font-weight:600; }

  .rules-toggle{ text-align:center; margin-top:6px; }
  .rules-toggle button{ background:none; color:var(--violet); font-size:calc(13px * var(--text-scale)); font-weight:700; text-decoration:underline; font-family:'Nunito',sans-serif; }

  /* ---------- home-screen top links ---------- */
  .mode-toggle-row{
    display:flex; align-items:center; justify-content:center; gap:16px; margin-top:6px; flex-wrap:wrap;
  }
  .mode-toggle-row button{
    background:none; font-size:calc(13px * var(--text-scale)); font-weight:700; text-decoration:underline;
    font-family:'Nunito',sans-serif; color:var(--violet);
  }

  /* ---------- settings modal ---------- */
  .settings-label{
    font-size:calc(11px * var(--text-scale)); text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace; font-weight:700; margin-bottom:8px;
  }
  .settings-segment{ display:flex; gap:8px; }
  .settings-toggle-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .segment-btn{
    flex:1; padding:11px 10px; border-radius:12px; border:2px solid var(--border);
    background:#FFFFFFCC; color:var(--text-muted); font-weight:700; font-size:calc(13px * var(--text-scale));
    font-family:'Nunito',sans-serif;
  }
  .segment-btn.active{ border-color:var(--violet); color:var(--violet); background:#FFFFFF; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .settings-row-text{ color:var(--text-muted); font-size:calc(13px * var(--text-scale)); font-weight:600; line-height:1.4; }
  .switch{ position:relative; display:inline-block; width:calc(44px * var(--text-scale)); height:calc(26px * var(--text-scale)); flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .slider{
    position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:background .15s ease;
  }
  .switch .slider::before{
    content:""; position:absolute; height:calc(20px * var(--text-scale)); width:calc(20px * var(--text-scale)); left:3px; top:3px; background:#fff;
    border-radius:50%; transition:transform .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .slider{ background:var(--violet); }
  .switch input:checked + .slider::before{ transform:translateX(calc(18px * var(--text-scale))); }

  ::selection{ background:var(--pink); color:#fff; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* =====================================================================
     DARK MODE
     Same layout & components — only colour is repainted for a dim, low-
     glare palette. Letter tiles stay bright white (like physical tiles)
     since that's the single most important thing to read at a glance.
     ===================================================================== */
  body.dark-mode{
    --ink:#F1EAFF;
    --panel:rgba(255,255,255,.06);
    --panel-2:rgba(255,255,255,.045);
    --tile:#FFFFFF;
    --tile-ink:#2A2040;
    --pink:#FF7FC4;
    --orange:#FFB259;
    --yellow:#FFE06B;
    --mint:#5FE0B7;
    --sky:#70D2FF;
    --violet:#BB9EFF;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet);
    --teal:var(--sky);
    --brick:#FF7C93;
    --sage:#57E6AE;
    --text:#EFE9FB;
    --text-muted:#B6A9DA;
    --line:#372B54;
    --border:#3A2E58;
    background:
      radial-gradient(circle at 15% 10%, #2A1F42 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #17233B 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #142A24 0%, transparent 50%),
      linear-gradient(160deg,#120C20 0%,#161029 35%,#0D131F 70%,#0C1613 100%);
    background-attachment:fixed;
  }
  body.dark-mode .panel{
    border-color:rgba(255,255,255,.08);
    box-shadow:0 8px 30px -12px rgba(0,0,0,.55);
  }
  body.dark-mode .btn-outline{ background:rgba(255,255,255,.05); color:var(--text); border-color:var(--violet); }
  body.dark-mode .btn-outline:hover{ background:rgba(255,255,255,.09); }
  body.dark-mode .btn-gold{ color:#241835; }
  body.dark-mode .stepper button{ background:rgba(255,255,255,.07); color:var(--violet); border-color:var(--border); }
  body.dark-mode .stepper .count{ color:var(--ink); }
  body.dark-mode .name-row input{ background:rgba(255,255,255,.06); color:var(--text); border-color:var(--border); }
  body.dark-mode .name-row input::placeholder{ color:var(--text-muted); opacity:.8; }
  body.dark-mode .loadout-chip{ background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-muted); }
  body.dark-mode .status-chip{ background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-muted); }
  body.dark-mode .clock-badge{ background:rgba(255,255,255,.07); border-color:var(--border); color:var(--ink); }
  body.dark-mode .clock-badge.low{ background:var(--brick); border-color:var(--brick); color:#fff; }
  body.dark-mode .toast{ background:#241C38F2; border-color:var(--violet); color:var(--ink); box-shadow:0 8px 24px rgba(0,0,0,.5); }
  body.dark-mode .letterpicker button{ background:rgba(255,255,255,.07); color:var(--ink); border-color:var(--border); }
  body.dark-mode .letterpicker button:hover{ border-color:var(--violet); }
  body.dark-mode .modal-backdrop{ background:rgba(6,4,14,.72); }
  body.dark-mode .modal{ background:#1C1730; border-color:var(--border); box-shadow:0 20px 50px -15px rgba(0,0,0,.65); }
  body.dark-mode .modal h3{ color:var(--ink); }
  body.dark-mode .core-card{ box-shadow:0 0 0 4px transparent, 0 10px 22px -10px rgba(0,0,0,.55); }
  body.dark-mode .core-card.wild-core{ background-image:linear-gradient(155deg,#fff 0%, #FFF5FC 100%), var(--rainbow); }
  body.dark-mode .htile, body.dark-mode .btile{ box-shadow:0 4px 10px -4px rgba(0,0,0,.4); }
  body.dark-mode ::selection{ background:var(--pink); color:#1C1730; }
  body.dark-mode .segment-btn{ background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-muted); }
  body.dark-mode .segment-btn.active{ border-color:var(--violet); color:var(--violet); background:rgba(255,255,255,.09); }

  /* ---------- rainbow mode: extra flair, works in Light or Dark Mode ---------- */
  @keyframes rainbowHueShift{ 0%{ filter:hue-rotate(0deg); } 100%{ filter:hue-rotate(360deg); } }
  @keyframes rainbowGlow{
    0%,100%{ box-shadow:0 0 0 1px rgba(255,127,196,.55), 0 8px 30px -10px rgba(255,127,196,.4); }
    16%{ box-shadow:0 0 0 1px rgba(255,178,89,.55), 0 8px 30px -10px rgba(255,178,89,.4); }
    33%{ box-shadow:0 0 0 1px rgba(255,224,107,.55), 0 8px 30px -10px rgba(255,224,107,.4); }
    50%{ box-shadow:0 0 0 1px rgba(95,224,183,.55), 0 8px 30px -10px rgba(95,224,183,.4); }
    66%{ box-shadow:0 0 0 1px rgba(112,210,255,.55), 0 8px 30px -10px rgba(112,210,255,.4); }
    83%{ box-shadow:0 0 0 1px rgba(187,158,255,.55), 0 8px 30px -10px rgba(187,158,255,.4); }
  }
  body.rainbow-mode .thread,
  body.rainbow-mode .mini-logo .thread,
  body.rainbow-mode .btn-gold,
  body.rainbow-mode .core-card,
  body.rainbow-mode .core-thread,
  body.rainbow-mode .btile.wild-tile,

  body.rainbow-mode .panel{

  }
  body.rainbow-mode .winscreen h1{ animation:winnerTitlePop .6s cubic-bezier(.34,1.56,.64,1), rainbowHueShift 6s linear infinite; }

  /* =====================================================================
     BIGGER TEXT
     Independent of every other setting, and works the same in Light or
     Dark Mode. One scale variable drives font-size everywhere (headings,
     buttons, tiles, chips, modals) plus the letter-tile boxes that need
     to grow along with their text. Rows that hold several tiles/chips
     already wrap (flex-wrap / grid), so the extra size just pushes
     overflow items down onto a new line instead of shrinking or
     spilling off screen.
     ===================================================================== */
  body.big-text{ --text-scale:1.5; }
  body.big-text .letterpicker{ grid-template-columns:repeat(4,1fr); }
  body.big-text .btn{ padding:16px 20px; }
  body.big-text .panel{ padding:20px; }
  body.big-text .btn-row{ flex-wrap:wrap; row-gap:8px; }
  body.big-text .btn-row button{ flex:1 1 calc(50% - 4px) !important; }
  body.big-text .row-header{ flex-wrap:wrap; }
  body.big-text .word-status{

    overflow:visible; text-overflow:clip; line-height:1.5; margin-top:2px;
  }
  /* The gate ("pass the device" / "CPU is thinking") screen already has a
     large emoji plus a name heading — scaling both by the full text-scale
     factor pushes the emoji (and the button below it) off a small phone
     screen. Cap the name text growth here so the emoji keeps its full,
     clearly-legible size and everything still fits in one view. */
  body.big-text .gate .thread-icon{ margin-bottom:10px; }
  body.big-text .gate h2{ font-size:calc(24px * 1.15); }
  body.big-text .gate-name{ font-size:calc(34px * 1.15); margin-bottom:10px; }

/* ============================= PLAYTESTING ANALYTICS =====================
   Lightweight, fire-and-forget event log written to its own Firestore
   collection — separate from the "rooms" collection used for live online
   game sync, so it doesn't interfere with or get cleaned up alongside game
   state. Works in BOTH local pass-and-play and online modes, since `db` is
   initialized unconditionally above regardless of which mode is played.

   Design notes:
   - Never blocks or slows down gameplay: writes are async and any failure
     (offline, permissions, etc.) is silently swallowed.
   - Respects the Analytics toggle in Settings (opt-out, on by default) —
     when off, logEvent() is a no-op.
   - Every event carries a per-game sessionId (regenerated at the start of
     each game) so events can be grouped into a single game/session later,
     plus the play mode and whether Clock mode was active.
   - See /mnt/user-data/outputs/analytics-dashboard.html for the companion
     read-only dashboard that queries and charts this collection.
============================================================================ */
let analyticsSessionId = null;
function newAnalyticsSession(){
  analyticsSessionId = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  return analyticsSessionId;
}
function logEvent(name, payload){
  if(!state.analyticsEnabled || !db) return;
  try{
    db.collection("analytics_events").add(Object.assign({
      event: name,
      session: analyticsSessionId || newAnalyticsSession(),
      mode: state.mode,
      clockMode: !!state.clockMode,
      playerCount: state.players ? state.players.length : null,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    }, payload || {})).catch(()=>{ /* analytics failures must never affect gameplay */ });
  }catch(e){ /* ignore — e.g. Firestore SDK not ready yet */ }
}

}

/* --- Chimes & alerts --------------------------------------------------
   Three distinct WebAudio chimes, all played on a single persistent
   AudioContext that's unlocked by the player's very first tap on the page
   (see the "unlockAudioOnce" listener below). Browsers only allow an
   AudioContext to start/resume as a direct result of a user gesture — a
   turn/round/game change arriving later via the Firestore listener isn't
   one — so a fresh AudioContext created at that moment would stay silently
   suspended forever. Reusing one that was already unlocked earlier
   sidesteps that: once "running", it stays usable for any future sound.
     - playTurnChime: two quick ascending notes — fired once per transition
       into isMyTurn===true (see renderOnlinePlay)
     - playRoundEndChime: a slightly longer three-note phrase — fired once
       per transition into the roundEnd screen
     - playGameEndChime: a four-note ascending fanfare — fired once per
       transition into the gameOver screen
   (edge-detection for the latter two lives in render(), via lastChimeScreen)
------------------------------------------------------------------------- */
let wasMyOnlineTurn = false;
let lastChimeScreen = null;
let titleFlashTimer = null;
const ORIGINAL_TITLE = document.title;
let sharedAudioCtx = null;

function unlockAudioOnce(){
  if(sharedAudioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  sharedAudioCtx = new Ctx();
  // Some browsers still hand back a "suspended" context even from a real
  // gesture until resume() is explicitly called on it.
  if(sharedAudioCtx.state === "suspended") sharedAudioCtx.resume();
  document.removeEventListener("pointerdown", unlockAudioOnce);
  document.removeEventListener("keydown", unlockAudioOnce);
}
document.addEventListener("pointerdown", unlockAudioOnce);
document.addEventListener("keydown", unlockAudioOnce);

// notes: array of {freq, at, dur}. `at` and `dur` are in seconds, relative
// to when playback starts. `gain` is peak volume (0-1).
function playNotes(notes, gain){
  try{
    if(!sharedAudioCtx) return; // no gesture has unlocked audio yet
    const ctx = sharedAudioCtx;
    const schedule = ()=>{
      const now = ctx.currentTime;
      notes.forEach(({freq, at, dur})=>{
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const start = now + at;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(gain, start + Math.min(0.02, dur/4));
        g.gain.linearRampToValueAtTime(0, start + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      });
    };
    if(ctx.state === "suspended") ctx.resume().then(schedule);
    else schedule();
  }catch(e){ /* audio not available — chime is best-effort */ }
}

function playTurnChime(){

// Returns the highest-scoring player who has reached WINNING_SCORE, or null.
// Used both at round-end and after ordinary word plays, since a player's
// score can cross the threshold either way (round-end bonus points, or
// plain per-word points on a turn where their hand doesn't empty).
function checkForWinner(){
  const active = state.players.filter(pl => !pl.eliminated);
  if(!active.length) return null;
  const maxScore = Math.max(...active.map(pl => pl.score));
  if(maxScore < WINNING_SCORE) return null;
  const tied = active.filter(pl => pl.score === maxScore);
  if(tied.length === 1) return tied[0];

  // Tie at the top: whoever most recently won a round takes it, including
  // the round that just ended (its roundBonus entry is already the newest
  // thing in the log by the time this runs). Scan newest-first.
  if(state.wordLog){
    for(let i = state.wordLog.length - 1; i >= 0; i--){
      const entry = state.wordLog[i];
      if(entry.type === "roundBonus"){
        const match = tied.find(pl => pl.name === entry.by);
        if(match) return match;
      }
    }
  }
  // No round-win history to break the tie by (shouldn't normally happen) —
  // fall back to the first tied player rather than leaving it undecided.
  return tied[0];
}

// A tiny seedable PRNG (mulberry32) + string-to-seed hash, used only by
// Daily Challenge mode so every player gets an identical shuffled deck (and
// the CPU makes identical tie-break choices) on a given calendar date.
// Every other mode still uses the browser's real Math.random via the
// default parameter below — nothing changes for local/online play.
function seedFromString(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayDateString(){
  return new Date().toISOString().slice(0, 10); // YYYY-MM-DD, UTC — same puzzle worldwide
}

  let cards = [];
  for(const letter in LETTER_DISTRIBUTION){
    for(let i=0;i<LETTER_DISTRIBUTION[letter];i++){
      cards.push({ id: nextId(), kind:"letter", letter });
    }
  }
  return shuffle(cards, rng);
}

function shuffle(arr, rng){
  rng = rng || Math.random;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============================= GAME SETUP ============================= */

/* ============================= DAILY CHALLENGE =============================
   A 1-human-vs-1-CPU game with a deterministic, date-seeded deck so every
   player gets the identical starting hands, wildcards, and Core Card on a
   given day. Reuses the entire normal local-game screen flow (gate/play/
   round-end) — "daily" behaves exactly like "local" everywhere else in the
   app, since every other state.mode check in the codebase is specifically
   `=== "online"` (with everything else falling into the same local-style
   branch). The only daily-specific pieces are: seeding dealRound()/the AI's
   word tie-breaking (above), gating one attempt per day, and — once the
   game ends — posting the net score and showing today's percentile instead
   of the normal win screen.

   Known limitation: the human and CPU draw from ONE shared seeded deck
   (matching how a normal 2-player game already works), so if two different
   people play very differently — drawing a different number of bonus cards
   at different points — the CPU can end up seeing slightly different card
   draws deeper into the game, even though everyone's *starting* hands, the
   starting Core Card, and the CPU's decision-making logic are identical.
   In practice this is a fairly small effect (a card or two of drift), and
   fixing it fully would mean giving the CPU its own separate seeded card
   supply — a bigger change than made sense for a first version of this. */
function dailyAlreadyPlayedToday(){
  try{ return localStorage.getItem("endlink_daily_last_played") === todayDateString(); }
  catch(e){ return false; }
}
function getStoredDailyResult(){
  try{
    const raw = localStorage.getItem("endlink_daily_last_result");
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function storeDailyResult(result){
  try{
    localStorage.setItem("endlink_daily_last_played", todayDateString());
    localStorage.setItem("endlink_daily_last_result", JSON.stringify(result));
  }catch(e){ /* ignore */ }
}
function getDailyPlayerName(){
  try{ return localStorage.getItem("endlink_daily_name") || ""; }
  catch(e){ return ""; }
}
function setDailyPlayerName(name){
  try{ localStorage.setItem("endlink_daily_name", name); }catch(e){ /* ignore */ }
}

/* ---- Lifetime Daily Challenge stats ----------------------------------
   Purely local (localStorage), one entry per calendar day played, keyed
   by date so a duplicate submit for the same day overwrites rather than
   double-counts. Everything in the stats popup is derived from this
   history — nothing here depends on Firestore, so stats still work even
   if the leaderboard/percentile fetch fails. */
function getDailyStatsHistory(){
  try{
    const raw = localStorage.getItem("endlink_daily_stats");
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function recordDailyStatsEntry(entry){
  try{
    const history = getDailyStatsHistory().filter(e => e.date !== entry.date);
    history.push(entry);
    history.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    localStorage.setItem("endlink_daily_stats", JSON.stringify(history));
  }catch(e){ /* ignore */ }
}
function isNextCalendarDay(a, b){
  return (new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) === 86400000;
}
function computeDailyStatsSummary(){
  const history = getDailyStatsHistory();
  if(!history.length){
    return { gamesPlayed:0, currentStreak:0, longestStreak:0, bestFinish:null, bestNetScore:null, avgNetScore:0, longestWord:"" };
  }
  const dates = history.map(e => e.date).sort();

  let longestStreak = 1, run = 1;
  for(let i=1;i<dates.length;i++){
    run = isNextCalendarDay(dates[i-1], dates[i]) ? run + 1 : 1;
    longestStreak = Math.max(longestStreak, run);
  }

  let currentStreak = 0;
  const lastDate = dates[dates.length - 1];
  const todayStr = todayDateString();
  const yesterdayStr = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if(lastDate === todayStr || lastDate === yesterdayStr){
    currentStreak = 1;
    for(let i=dates.length-1; i>0; i--){
      if(isNextCalendarDay(dates[i-1], dates[i])) currentStreak++; else break;
    }
  }

  const finishes = history.map(e => e.percentile).filter(p => p != null);
  const bestFinish = finishes.length ? Math.max(...finishes) : null;
  const netScores = history.map(e => e.netScore).filter(n => typeof n === "number");
  const bestNetScore = netScores.length ? Math.max(...netScores) : null;
  const avgNetScore = netScores.length ? netScores.reduce((a,b)=>a+b,0) / netScores.length : 0;
  let longestWord = "";
  history.forEach(e => { if(e.longestWord && e.longestWord.length > longestWord.length) longestWord = e.longestWord; });

  return { gamesPlayed: history.length, currentStreak, longestStreak, bestFinish, bestNetScore, avgNetScore, longestWord };
}

function startDailyGame(){
  if(dailyAlreadyPlayedToday()){
    state.screen = "dailyResult";
    render();
    return;
  }
  const dateStr = todayDateString();
  state.mode = "daily";
  state.dailyDate = dateStr;
  state.dailyRng = mulberry32(seedFromString("at-last-daily-" + dateStr));
  state.players = [
    { name: getDailyPlayerName() || "You", hand:[], wildcards:[], score:0, isCPU:false, color:PLAYER_COLORS[0], timeLeft:120, eliminated:false },
    { name:"Computer", hand:[], wildcards:[], score:0, isCPU:true, color:PLAYER_COLORS[1], timeLeft:120, eliminated:false },
  ];
  state.lastRound = null;
  state.gameWinner = null;
  state.wordLog = [];
  state.roundNum = 0;
  newAnalyticsSession();
  logEvent("game_started", { playerCount:2, cpuCount:1, clockMode:false, mode:"daily" });
  dealRound();

}

/* Posts today's result and fetches how it compares to everyone else who has
   played today. Fire on entering the result screen; re-fetching each visit
   keeps the percentile fresh as more people play the same puzzle. */
async function submitAndFetchDailyPercentile(){
  const you = state.players[0];
  const cpu = state.players[1];
  const netScore = you.score - cpu.score;
  const result = { date: state.dailyDate, humanScore: you.score, cpuScore: cpu.score, netScore, name: you.name || "You" };
  storeDailyResult(result);

  const yourWords = (state.wordLog || []).filter(e => e.type === "word" && e.by === you.name);
  const longestWord = yourWords.reduce((best, e) => (e.word && e.word.length > best.length) ? e.word : best, "");

  state.dailyPercentile = null;
  state.dailyPlayerCount = null;
  state.dailyLeaderboard = null;
  state.dailyFetchError = null;
  render();

  if(!db){
    state.dailyFetchError = "not_configured";
    recordDailyStatsEntry({ date: state.dailyDate, netScore, percentile: null, longestWord });
    render();
    return;
  }
  try{
    await db.collection("daily_results").add(Object.assign({}, result, {
      clientId: getClientId(),
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    }));
    await fetchDailyPercentileOnly(state.dailyDate, netScore);
  }catch(e){
    console.error("Daily result submit failed:", e);
    state.dailyFetchError = "write_failed";
  }
  recordDailyStatsEntry({ date: state.dailyDate, netScore, percentile: state.dailyPercentile, longestWord });
  render();
}

/* Same percentile + leaderboard lookup as above, minus posting a new result
   — used when showing a returning visitor's already-submitted score for
   today (e.g. they reopened the app later the same day) so it doesn't
   double-count their result while still refreshing how it compares. */
async function fetchDailyPercentileOnly(dateStr, netScore){
  if(!db){ state.dailyFetchError = "not_configured"; return; }
  try{
    const snap = await db.collection("daily_results").where("date", "==", dateStr).get();
    const rows = snap.docs
      .map(d => d.data())
      .filter(r => typeof r.netScore === "number");
    if(rows.length){
      const beatenOrTied = rows.filter(r => r.netScore <= netScore).length;
      state.dailyPercentile = Math.round((beatenOrTied / rows.length) * 100);
      state.dailyPlayerCount = rows.length;
      state.dailyLeaderboard = rows
        .sort((a,b) => b.netScore - a.netScore)
        .map(r => ({ name: r.name || "Player", netScore: r.netScore, clientId: r.clientId || null }));
    }
  }catch(e){
    console.error("Daily percentile fetch failed:", e);
    state.dailyFetchError = "read_failed";
  }
}

function startGame(){
  state.players = [];
  let cpuSeen = 0;
  for(let i=0;i<state.playerCount;i++){
    const isCPU = !!state.cpu[i];
    let defaultName;
    if(isCPU){
      cpuSeen++;
      defaultName = cpuSeen === 1 ? "Computer" : ("Computer " + cpuSeen);
    } else {
      defaultName = "Player " + (i+1);
    }
    state.players.push({
      name: (!isCPU && state.names[i] && state.names[i].trim()) ? state.names[i].trim() : defaultName,
      hand: [],
      wildcards: [],
      score: 0,
      isCPU,
      color: PLAYER_COLORS[i % PLAYER_COLORS.length],
      timeLeft: 120,
      eliminated: false,
    });
  }
  state.lastRound = null;
  state.gameWinner = null;
  state.wordLog = [];
  state.roundNum = 0;
  newAnalyticsSession();
  logEvent("game_started", {
    playerCount: state.playerCount,
    cpuCount: state.cpu.filter(Boolean).length,
    clockMode: !!state.clockMode,
  });
  dealRound();
  state.currentPlayer = 0;
  state.screen = "gate";
  render();
}

/* rebuilds the deck and deals a fresh hand to every existing player, keeping their scores */
function dealRound(){
  state.deck = buildDeck(state.mode === "daily" ? state.dailyRng : undefined);
  state.discard = [];

  state.players.forEach(p=>{
    if(p.eliminated){ p.hand = []; p.wildcards = []; return; }
    p.hand = state.deck.splice(0,7);
    p.wildcards = [
      { id: nextId(), kind:"wildcard", assignedLetter:null },
      { id: nextId(), kind:"wildcard", assignedLetter:null },
    ];
  });

  state.core = state.deck.shift();
  state.builder = [];
  state.coreInsertedAt = -1;
  state.lastPlay = null;

  state.roundNum = (state.roundNum || 0) + 1;
  logEvent("round_started", {
    roundNum: state.roundNum,
    coreLetter: displayLetter(state.core),
  });
}

/* reads ?room=CODE from the URL, e.g. from a link the host shared */
function getRoomCodeFromURL(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get("room");
  return code ? code.trim().toUpperCase() : null;
}

function buildInviteLink(code){
  return window.location.origin + window.location.pathname + "?room=" + code;
}

function getClientId(){
  let id = localStorage.getItem("endlink_client_id");
  if(!id){
    id = "c_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("endlink_client_id", id);
  }
  return id;
}

function makeRoomCode(){
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ"; // no I/O — avoids confusion
  let code = "";
  for(let i=0;i<4;i++) code += letters[Math.floor(Math.random()*letters.length)];
  return code;
}

function createRoom(){
  if(!FIREBASE_CONFIGURED){ state.online.error = "Firebase isn't set up yet — see the setup comment near the top of this file's <script>."; render(); return; }
  const name = (state.online.myName||"").trim() || "Player 1";
  const maxPlayers = state.online.maxPlayers;
  const code = makeRoomCode();
  const clientId = getClientId();
  const seats = Array.from({length:maxPlayers}, ()=>({name:null,isCPU:false,clientId:null}));
  seats[0] = { name, isCPU:false, clientId };
  db.collection("rooms").doc(code).set({
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    maxPlayers, hostClientId: clientId, status: "lobby", seats, game: null,
  }).then(()=>{
    localStorage.setItem("endlink_online_session", JSON.stringify({code, clientId}));
    state.online.code = code;
    state.online.clientId = clientId;
    state.online.mySeat = 0;
    state.online.isHost = true;
    state.online.error = null;
    state.screen = "lobby";
    listenToRoom(code);
    render();
  }).catch(err=>{
    state.online.error = "Couldn't create room: " + err.message;
    render();
  });
}

function joinRoom(){
  if(!FIREBASE_CONFIGURED){ state.online.error = "Firebase isn't set up yet — see the setup comment near the top of this file's <script>."; render(); return; }
  const code = (state.online.joinCodeInput||"").trim().toUpperCase();
  const name = (state.online.myName||"").trim() || "Player";
  if(!code){ state.online.error = "Enter a room code."; render(); return; }
  const clientId = getClientId();
  const ref = db.collection("rooms").doc(code);
  db.runTransaction(async (tx)=>{
    const doc = await tx.get(ref);
    if(!doc.exists) throw new Error("No room with that code.");
    const data = doc.data();
    if(data.status !== "lobby") throw new Error("That game has already started.");
    const seats = data.seats.slice();
    let seatIdx = seats.findIndex(s=>s.clientId === clientId);
    if(seatIdx === -1){
      seatIdx = seats.findIndex(s=>!s.clientId);
      if(seatIdx === -1) throw new Error("That room is full.");
      seats[seatIdx] = { name, isCPU:false, clientId };
      tx.update(ref, { seats });
    }
    return { seatIdx, hostClientId: data.hostClientId };
  }).then(({seatIdx, hostClientId})=>{
    localStorage.setItem("endlink_online_session", JSON.stringify({code, clientId}));
    state.online.code = code;
    state.online.clientId = clientId;
    state.online.mySeat = seatIdx;
    state.online.isHost = (clientId === hostClientId);
    state.online.error = null;
    state.screen = "lobby";
    listenToRoom(code);
    render();
  }).catch(err=>{
    state.online.error = err.message;
    render();
  });
}

/* host-only: fill or clear an empty lobby seat with a Computer player */
function setSeatCPU(seatIdx, isCPU){
  if(!state.online.isHost) return;
  const seats = state.online.seats.slice();
  seats[seatIdx] = isCPU
    ? { name: null, isCPU: true, clientId: "CPU_" + seatIdx + "_" + Date.now() }
    : { name: null, isCPU: false, clientId: null };
  db.collection("rooms").doc(state.online.code).update({ seats });
}

/* host-only: deal the first hand and move the room from "lobby" to "playing" */
function startOnlineGame(){
  if(!state.online.isHost) return;
  const seats = state.online.seats;
  if(seats.some(s=>!s.clientId && !s.isCPU)) return; // guard — button should already be disabled

  state.players = [];
  let cpuSeen = 0;
  seats.forEach((s,i)=>{
    const color = PLAYER_COLORS[i % PLAYER_COLORS.length];
    if(s.isCPU){
      cpuSeen++;
      const defaultName = cpuSeen === 1 ? "Computer" : ("Computer " + cpuSeen);
      state.players.push({ name: defaultName, hand:[], wildcards:[], score:0, isCPU:true, color, timeLeft:120, eliminated:false });
    } else {
      state.players.push({ name: s.name || ("Player " + (i+1)), hand:[], wildcards:[], score:0, isCPU:false, color, timeLeft:120, eliminated:false });
    }
  });
  state.lastRound = null;
  state.gameWinner = null;
  state.wordLog = [];
  state.roundNum = 0;
  newAnalyticsSession();
  logEvent("game_started", {
    playerCount: state.players.length,
    cpuCount: state.players.filter(pl=>pl.isCPU).length,
    clockMode: !!state.clockMode,
  });
  dealRound();
  state.currentPlayer = 0;
  state.screen = "onlinePlay";
  syncOnline();
  render();
}

/* subscribes this client to the room doc; every field it reads back into
   `state` mirrors what's on Firestore, so all phones converge on the same view */
function listenToRoom(code){
  if(state.online.unsub) state.online.unsub();
  state.online.unsub = db.collection("rooms").doc(code).onSnapshot(doc=>{
    if(!doc.exists){
      state.online.error = "This room no longer exists.";
      state.screen = "onlineSetup";
      render();
      return;
    }
    const data = doc.data();
    state.online.seats = data.seats;
    state.online.maxPlayers = data.maxPlayers;
    state.online.isHost = data.hostClientId === state.online.clientId;

    if(data.status === "lobby"){
      state.screen = "lobby";
    } else {
      applyIncomingGame(data.game);
      state.builder = [];
      state.coreInsertedAt = -1;
      if(data.status === "playing") state.screen = "onlinePlay";
      else if(data.status === "roundEnd") state.screen = "roundEnd";
      else if(data.status === "gameOver") state.screen = "gameOver";
    }
    render();
  });
}

function applyIncomingGame(g){
  if(!g) return;
  state.players = g.players;
  state.deck = g.deck;
  state.discard = g.discard;
  state.core = g.core;
  state.currentPlayer = g.currentPlayer;
  state.lastRound = g.lastRound;
  state.lastPlay = g.lastPlay || null;
  state.nextStarter = g.nextStarter;
  state.gameWinner = g.gameWinner;
  state.wordLog = g.wordLog || [];
}

/* pushes the local, already-mutated shared game fields up to Firestore so
   every other phone's listener picks up the change. Safe to call from local
   (pass & play) code paths too — it's a no-op unless mode is "online". */
function syncOnline(){
  if(state.mode !== "online" || !state.online.code || !db) return;
  const status = state.screen === "roundEnd" ? "roundEnd" : state.screen === "gameOver" ? "gameOver" : "playing";
  db.collection("rooms").doc(state.online.code).update({
    status,
    game: {
      players: state.players,
      deck: state.deck,
      discard: state.discard,
      core: state.core,
      currentPlayer: state.currentPlayer,
      lastRound: state.lastRound,
      lastPlay: state.lastPlay || null,
      nextStarter: state.nextStarter,
      gameWinner: state.gameWinner,
      wordLog: state.wordLog || [],
    },
  }).catch(err=>{
    console.error("At Last sync error:", err);
    showToast("Connection hiccup — your move may not have reached everyone yet.");
  });
}

function leaveOnlineRoom(){
  stopClock();
  if(state.online.unsub){ state.online.unsub(); }
  localStorage.removeItem("endlink_online_session");
  state.mode = "local";
  state.online = { code:null, clientId:null, mySeat:-1, isHost:false, seats:[], maxPlayers:4, myName:"", joinCodeInput:"", error:null, unsub:null, fromInvite:false };
  state.screen = "home";
  render();
}

/* used from mid-game screens, where leaving can strand the other players
   (especially if it's your turn) — a lobby/game-over "leave" doesn't need this */
function confirmLeaveOnlineRoom(){

    leaveOnlineRoom();

}

/* best-effort: if this phone already had a room open (e.g. the page was
   refreshed), silently rejoin it instead of dropping back to the home screen */
function tryResumeSession(){
  if(!FIREBASE_CONFIGURED) return;
  const raw = localStorage.getItem("endlink_online_session");
  if(!raw) return;
  let saved;
  try{ saved = JSON.parse(raw); } catch(e){ return; }
  if(!saved || !saved.code || !saved.clientId) return;
  state.mode = "online";
  state.online.code = saved.code;
  state.online.clientId = saved.clientId;
  db.collection("rooms").doc(saved.code).get().then(doc=>{
    if(!doc.exists){ localStorage.removeItem("endlink_online_session"); return; }
    const data = doc.data();
    const seatIdx = data.seats.findIndex(s=>s.clientId === saved.clientId);
    if(seatIdx === -1){ localStorage.removeItem("endlink_online_session"); return; }
    state.online.mySeat = seatIdx;
    state.online.isHost = data.hostClientId === saved.clientId;
    listenToRoom(saved.code);
  }).catch(()=>{});
}

/* ============================= HELPERS ============================= */

function currentPlayer(){ return state.players[state.currentPlayer]; }

/* end-of-round value of a player's remaining hand: 1 point per card left, plus a
   5-point bonus for every Wildcard still in hand (no letter-value calculations
   are used anymore — scoring only depends on card counts). */
function remainingHandPoints(p){
  return p.hand.length + p.wildcards.length*5;
}

function displayLetter(card){
  if(card.kind === "letter") return card.letter;
  if(card.assignedLetter) return card.assignedLetter;
  return "?";
}

function drawFromDeck(n=1){
  const out = [];
  for(let i=0;i<n;i++){
    if(state.deck.length===0){
      if(state.discard.length===0) break;
      state.deck = shuffle(state.discard, state.mode === "daily" ? state.dailyRng : undefined);
      state.discard = [];
    }
    if(state.deck.length>0) out.push(state.deck.shift());
  }
  return out;
}

/* ============================= CPU PLAYER AI ============================= */

let WORDS_BY_LENGTH = null;
function getWordsByLength(){
  if(WORDS_BY_LENGTH) return WORDS_BY_LENGTH;
  const map = {};
  DICTIONARY.forEach(w=>{
    const len = w.length;
    if(!map[len]) map[len] = [];
    map[len].push(w);
  });
  WORDS_BY_LENGTH = map;
  return map;
}

/* Given a target word and a chosen letter for the core card, work out whether the
   player's hand + wildcards can supply the rest. Returns a plan or null. */
function tryPlanFixed(word, handLetterCards, wildCards, coreLetter){
  const counts = {};
  word.split("").forEach(l=>{ counts[l] = (counts[l]||0) + 1; });
  if(!counts[coreLetter]) return null;
  counts[coreLetter]--;

  const availableHand = handLetterCards.slice();
  const usedHandCards = [];
  Object.keys(counts).forEach(letter=>{
    while(counts[letter] > 0){
      const idx = availableHand.findIndex(c=>c.letter===letter);
      if(idx===-1) break;
      usedHandCards.push(availableHand[idx]);
      availableHand.splice(idx,1);
      counts[letter]--;
    }
  });

  const remainingLetters = [];
  Object.keys(counts).forEach(l=>{ for(let i=0;i<counts[l];i++) remainingLetters.push(l); });
  if(remainingLetters.length > wildCards.length) return null;

  return {
    coreLetter,
    usedHandCards,
    usedWildcards: wildCards.slice(0, remainingLetters.length),
    wildAssignments: remainingLetters,
  };
}

function tryPlanForWord(word, handLetterCards, wildCards, coreIsWild, coreLetter){
  if(coreIsWild){
    const distinctLetters = [...new Set(word.split(""))];
    for(const cl of distinctLetters){
      const plan = tryPlanFixed(word, handLetterCards, wildCards, cl);
      if(plan) return plan;
    }
    return null;
  }
  return tryPlanFixed(word, handLetterCards, wildCards, coreLetter);
}

/* Search for the longest playable word (ties broken randomly) for the given player. */
function planAIMove(p){
  const coreIsWild = state.core.kind !== "letter";
  const coreLetter = coreIsWild ? null : state.core.letter;
  const wordsByLength = getWordsByLength();
  // Max reachable length is hand letters + wildcards + the core letter itself.
  // Using hand.length alone here used to undercount whenever the hand had
  // shrunk to 1-2 cards (exactly when a player is leaning on wildcards) —
  // maxLen could drop below 3, so the search loop below never ran even once,
  // reporting "no word found" even though the core + wildcards alone could
  // have made a valid 3-letter word.
  const maxLen = Math.min(p.hand.length + p.wildcards.length + 1, 8);

  for(let len = maxLen; len >= 3; len--){
    const candidates = wordsByLength[len];
    if(!candidates || candidates.length === 0) continue;
    const shuffled = shuffle(candidates, state.mode === "daily" ? state.dailyRng : undefined);
    for(const word of shuffled){
      const plan = tryPlanForWord(word, p.hand, p.wildcards, coreIsWild, coreLetter);
      if(plan) return { word, plan };
    }
  }
  return null;
}

/* Turns a word + plan into an actual builder array (mirrors what a human would
   assemble by tapping tiles), assigning wildcard letters along the way. */
function assembleBuilder(word, plan){
  plan.usedWildcards.forEach((card, i)=>{ card.assignedLetter = plan.wildAssignments[i]; });

  const handPool = plan.usedHandCards.slice();
  const wildPool = plan.usedWildcards.slice();
  const builder = [];
  let coreInsertedAt = -1;
  let coreConsumed = false;

  for(let i=0;i<word.length;i++){
    const ch = word[i];
    if(!coreConsumed && ch === plan.coreLetter){
      if(state.core.kind !== "letter") state.core.assignedLetter = plan.coreLetter;
      builder.push(state.core);
      coreInsertedAt = i;
      coreConsumed = true;
      continue;
    }
    const handIdx = handPool.findIndex(c=>c.letter===ch);
    if(handIdx !== -1){
      builder.push(handPool[handIdx]);
      handPool.splice(handIdx,1);
      continue;
    }
    const wildIdx = wildPool.findIndex(c=>c.assignedLetter===ch);
    if(wildIdx !== -1){
      builder.push(wildPool[wildIdx]);
      wildPool.splice(wildIdx,1);
      continue;
    }
    return null; // shouldn't happen if the plan was built correctly
  }
  if(!coreConsumed) return null;
  return { builder, coreInsertedAt };
}

/* Runs one full CPU turn: find the best word it can play, or draw a wildcard,
   or pass if truly stuck. */
function playAITurn(){
  if(state.mode === "online" && !state.online.isHost) return;
  const p = currentPlayer();
  // Mark which player this AI turn belongs to. Some paths below (showToast,
  // via commitWord/drawCard/the pass branch) call render() synchronously
  // *before* advanceTurn() runs, while we're still on this same player's
  // "gate" screen. renderGate()'s scheduling check uses this marker (rather
  // than just _aiScheduled) so those intermediate renders don't sneak in a
  // duplicate timer for this same turn — which would otherwise consume the
  // "not yet scheduled" slot and leave the *next* player's turn never
  // scheduled at all once advanceTurn() moves on.
  state._aiTurnPlayer = state.currentPlayer;
  const found = planAIMove(p);
  if(found){
    const assembled = assembleBuilder(found.word, found.plan);
    if(assembled){
      state.builder = assembled.builder;
      state.coreInsertedAt = assembled.coreInsertedAt;
      commitWord();
      state._aiTurnPlayer = -1;
      return;
    }
  }
  if(p.wildcards.length < 2){
    drawCard();
  } else {
    showToast(p.name + " couldn't find a play and passes.");
    advanceTurn();
  }
  state._aiTurnPlayer = -1;
}

function showToast(msg, ms=2600){
  state.toast = msg;
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ state.toast=null; render(); }, ms);
}

// Briefly pulses the Core Card to draw the eye to it right as a turn begins.
// Safe to call either from an event handler (it doesn't render itself — the
// caller is expected to render right after) or from mid-render (the flag is
// read later in the same render pass), since it only flips state and starts
// a timer to clear itself back off.
function triggerCorePulse(){
  state.corePulse = true;
  clearTimeout(triggerCorePulse._t);
  triggerCorePulse._t = setTimeout(()=>{ state.corePulse = false; render(); }, 600);
}

/* --- Clock mode ---------------------------------------------------------
   Each player gets a 2-minute budget for the whole game (not per turn or
   per round). The countdown only runs while it's actually that player's
   turn on the board — it starts the moment they land on the play screen
   and stops the moment they submit a word or draw a wildcard (both of
   which end their turn). One shared interval handle drives the tick;
   clockTick() is defensive about screen/mode so a stray leftover timer
   just quietly stops itself instead of doing anything harmful. */
let clockTimer = null;

function formatClock(seconds){
  const s = Math.max(0, Math.floor(seconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ":" + String(r).padStart(2, "0");
}

function stopClock(){
  clearInterval(clockTimer);
  clockTimer = null;
}

function startClock(){
  stopClock();
  if(!state.clockMode) return;
  clockTimer = setInterval(clockTick, 1000);
}

function clockTick(){
  if(!state.clockMode || (state.screen !== "play" && state.screen !== "onlinePlay")){
    stopClock();
    return;
  }
  const p = currentPlayer();
  if(!p){ stopClock(); return; }
  if(p.timeLeft == null) p.timeLeft = 120;
  p.timeLeft = Math.max(0, p.timeLeft - 1);
  if(p.timeLeft <= 0){
    stopClock();
    p.eliminated = true;
    if(!state.wordLog) state.wordLog = [];
    state.wordLog.push({ type:"eliminated", by: p.name, color: p.color });
    logEvent("player_eliminated", { playerIsCPU: !!p.isCPU });

    const remaining = state.players.filter(pl => !pl.eliminated);
    if(remaining.length <= 1){
      const winner = remaining[0] || p;
      showToast(p.name + " ran out of time and is out of the game!");
      state.gameWinner = winner.name;
      state.wordLog.push({ type:"eliminationWin", by: winner.name, color: winner.color });
      state.screen = "gameOver";
      logEvent("game_ended", {
        winner: winner.name,
        winMethod: "elimination",
        totalRounds: state.roundNum,
      });
      if(state.mode === "online") syncOnline();
      render();
      return;
    }

    showToast(p.name + " ran out of time and is out of the game!");
    state.builder = [];
    state.coreInsertedAt = -1;
    advanceTurn();
    return;
  }
  render();
}

function setClockMode(on){
  state.clockMode = on;
  try{ localStorage.setItem("endlink_clock_mode", on ? "1" : "0"); }catch(e){ /* ignore */ }
  if(on && (state.screen === "play" || state.screen === "onlinePlay")){
    startClock();
  } else {
    stopClock();
  }
}

function setAnalyticsEnabled(on){
  state.analyticsEnabled = on;
  try{ localStorage.setItem("endlink_analytics_opt_out", on ? "0" : "1"); }catch(e){ /* ignore */ }
}

function wordString(){
  return state.builder.map(displayLetter).join("");
}

/* ============================= BUILDER LOGIC ============================= */

function addHandCardToBuilder(card){
  if(card.kind !== "letter" && !card.assignedLetter){
    state.pendingWildAssign = { forCore:false, card };
    render();
    return;
  }
  state.builder.push(card);
  render();
}

function insertCoreIntoBuilder(){
  if(state.coreInsertedAt !== -1){ showToast("Core Card already placed in your word."); return; }
  if(state.core.kind !== "letter" && !state.core.assignedLetter){
    state.pendingWildAssign = { forCore:true, card: state.core };
    render();
    return;
  }
  state.builder.push(state.core);
  state.coreInsertedAt = state.builder.length - 1;
  render();
}

function assignWildLetter(letter){
  const pending = state.pendingWildAssign;
  if(!pending) return;
  pending.card.assignedLetter = letter;
  state.pendingWildAssign = null;
  if(pending.forCore){
    state.builder.push(pending.card);
    state.coreInsertedAt = state.builder.length - 1;
  } else {
    state.builder.push(pending.card);
  }
  render();
}

function cancelWildAssign(){
  state.pendingWildAssign = null;
  render();
}

function removeLastFromBuilder(){
  if(state.builder.length===0) return;
  const removed = state.builder.pop();
  if(state.coreInsertedAt === state.builder.length){ state.coreInsertedAt = -1; }
  if(removed.assignedLetter) removed.assignedLetter = null;
  render();
}

function removeBuilderIndex(idx){
  if(idx < 0 || idx >= state.builder.length) return;
  const removed = state.builder[idx];
  state.builder.splice(idx, 1);
  if(state.coreInsertedAt === idx){ state.coreInsertedAt = -1; }
  else if(state.coreInsertedAt > idx){ state.coreInsertedAt -= 1; }
  if(removed.assignedLetter) removed.assignedLetter = null;
  render();
}

function shuffleHand(){
  const p = state.mode === "online" ? state.players[state.online.mySeat] : currentPlayer();
  for(let i = p.hand.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [p.hand[i], p.hand[j]] = [p.hand[j], p.hand[i]];
  }
  render();
}

function cardInBuilder(card){
  return state.builder.includes(card);
}

function isValidWord(word){
  if(!word || word.length < 3) return false;
  return DICTIONARY.has(word.toUpperCase());
}

function canSubmit(){
  return state.builder.length >= 3;
}

/* ============================= PLAY WORD ============================= */

function bonusDrawAmount(wordLength){
  if(wordLength >= 5) return 2;
  if(wordLength === 4) return 1;
  return 0; // 3-letter word
}

/* In online mode, only two clients are ever allowed to drive a turn-action
   function: the player whose turn it actually is, or the host acting on
   behalf of a Computer player (playAITurn always runs on the host's phone).
   Blocking anyone else here is what stops two phones from acting at once. */
function onlineTurnAuthorized(){
  if(state.mode !== "online") return true;
  if(state.online.mySeat === state.currentPlayer) return true;
  const cp = state.players[state.currentPlayer];
  return !!(state.online.isHost && cp && cp.isCPU);
}

function attemptSubmit(){
  if(!onlineTurnAuthorized()) return;
  if(!canSubmit()) return;
  if(state.coreInsertedAt === -1){
    state.coreShake = true;
    showToast("Add the Core Card to your word first");
    render();
    clearTimeout(attemptSubmit._coreShakeTimer);
    attemptSubmit._coreShakeTimer = setTimeout(()=>{ state.coreShake = false; render(); }, 500);
    logEvent("word_attempt_failed", {
      reason: "missing_core_letter",
      coreLetter: displayLetter(state.core),
      attemptedWord: wordString(),
    });
    return;
  }
  const word = wordString();
  if(!isValidWord(word)){
    state.shakeWord = true;
    render();
    clearTimeout(attemptSubmit._shakeTimer);
    attemptSubmit._shakeTimer = setTimeout(()=>{ state.shakeWord = false; render(); }, 500);
    logEvent("word_attempt_failed", {
      reason: "not_in_dictionary",
      coreLetter: displayLetter(state.core),
      attemptedWord: word,
      wordLength: word.length,
    });
    return;
  }
  state.successWord = true;
  render();
  clearTimeout(attemptSubmit._successTimer);
  attemptSubmit._successTimer = setTimeout(()=>{
    state.successWord = false;
    commitWord();
  }, 550);
}

function commitWord(){
  stopClock();
  const p = currentPlayer();
  if(state.clockMode) p.timeLeft = (p.timeLeft ?? 120) + 10;
  const word = wordString();
  const lastCard = state.builder[state.builder.length-1];
  const playedCards = state.builder.filter(c => c !== lastCard);

  // snapshot the play (letters + which tiles were wildcards/the core) so the
  // next player's "pass the device" screen can show it before they see their hand
  state.lastPlay = {
    by: p.name,
    tiles: state.builder.map((c, idx) => ({
      letter: displayLetter(c),
      wild: c.kind !== "letter",
      core: idx === state.coreInsertedAt
    }))
  };

  // Score the word: 1 point for every letter played except the final letter
  // (which becomes the new Core Card). Wildcards never score.
  const wordPoints = playedCards.filter(c => c.kind === "letter").length;
  p.score += wordPoints;

  if(!state.wordLog) state.wordLog = [];
  state.wordLog.push({ type:"word", word, by: p.name, points: wordPoints, color: p.color });

  // remove used cards from hand, mark wildcard loadout as spent if used (any wildcard in builder that isn't core-carried forward and came from hand)
  const usedFromHand = state.builder.filter(c => c !== state.core);
  p.hand = p.hand.filter(c => !usedFromHand.includes(c));

  usedFromHand.forEach(c=>{
    if(c.kind === "wildcard") p.wildcards = p.wildcards.filter(w => w !== c);
  });

  logEvent("word_played", {
    word,
    wordLength: word.length,
    points: wordPoints,
    coreLetter: displayLetter(state.core),
    corePosition: corePositionBucket(state.coreInsertedAt, state.builder.length),
    wildcardsUsed: usedFromHand.filter(c => c.kind === "wildcard").length,
    playerIsCPU: !!p.isCPU,
  });

  // discard played letter cards (this feeds the reshuffle when the deck runs low).
  // Wildcards are never discarded into the letter deck — once played they're
  // simply returned to the (unlimited) Wildcard deck and cease to exist as a card.
  playedCards.forEach(c=>{
    if(c.kind === "letter") state.discard.push(c);
  });

  // set new core
  state.core = lastCard;
  if(state.core.kind !== "letter") state.core.assignedLetter = null;

  // check round end (before any bonus draw, since drawing never applies once hand is empty)
  if(p.hand.length === 0){
    let roundPoints = 0;
    let breakdown = [];
    let worstIdx = state.currentPlayer;
    let worstVal = -1;
    state.players.forEach((pl, idx)=>{
      if(pl === p) return;
      const val = remainingHandPoints(pl);
      breakdown.push({ name: pl.name, value: val });
      roundPoints += val;
      if(!pl.eliminated && val > worstVal){ worstVal = val; worstIdx = idx; }
    });
    p.score += roundPoints;
    state.lastRound = { winner: p.name, points: roundPoints, breakdown, word };
    state.nextStarter = worstIdx;
    if(!state.wordLog) state.wordLog = [];
    state.wordLog.push({ type:"roundBonus", by: p.name, points: roundPoints, color: p.color });

    logEvent("round_ended", {
      roundNum: state.roundNum,
      bonusPoints: roundPoints,
      wildcardsHeldByLosers: state.players.filter(pl => pl !== p).map(pl => pl.wildcards.length),
    });

    // Check every player's score, not just the one who emptied their hand —
    // other players' scores can also have crossed WINNING_SCORE (e.g. from
    // an earlier round) even though only p's score changed this turn.
    const champion = checkForWinner();

    if(champion){
      state.gameWinner = champion.name;
      state.screen = state.mode === "daily" ? "dailyResult" : "gameOver";
      logEvent("game_ended", {
        winner: champion.name,
        winMethod: "score",
        totalRounds: state.roundNum,
      });
    } else {
      state.screen = "roundEnd";
    }
    syncOnline();
    render();
    return;
  }

  state.builder = [];
  state.coreInsertedAt = -1;

  const bonus = bonusDrawAmount(word.length);
  let msg = p.name + " played \"" + word + "\" (+" + wordPoints + "). New Core Card: " + displayLetter(state.core) + ".";
  if(bonus > 0){
    const drawn = drawFromDeck(bonus);
    p.hand.push(...drawn);
    msg += " Bonus: drew " + drawn.length + " card" + (drawn.length===1?"":"s") + "!";
  }
  showToast(msg);
  advanceTurn();
}

function drawCard(){
  if(!onlineTurnAuthorized()) return;
  const p = currentPlayer();
  if(p.wildcards.length >= 2){
    showToast("Wildcard loadout is full (2/2) — play a word instead.");
    logEvent("wildcard_capped", { coreLetter: displayLetter(state.core), handSize: p.hand.length });
    render();
    return;
  }
  p.wildcards.push({ id: nextId(), kind:"wildcard", assignedLetter:null });
  if(!state.wordLog) state.wordLog = [];
  state.wordLog.push({ type:"wildcard", by: p.name, color: p.color });
  logEvent("wildcard_drawn", {
    coreLetter: displayLetter(state.core),
    handSize: p.hand.length,
    wildcardsHeldAfter: p.wildcards.length,
    playerIsCPU: !!p.isCPU,
  });
  showToast(p.name + " drew a Wildcard.");
  stopClock();
  if(state.clockMode) p.timeLeft = (p.timeLeft ?? 120) + 10;
  advanceTurn();
}

function advanceTurn(){
  // Skip past any eliminated (timed-out) players — they no longer take
  // turns. The `some` guard just prevents a runaway loop in the degenerate
  // case where everyone is eliminated; in normal play the game already
  // ends the instant only one active player remains, so this loop only
  // ever needs to skip over players, never search through all of them.
  do {
    state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
  } while(state.players[state.currentPlayer].eliminated && state.players.some(pl => !pl.eliminated));
  state.builder = [];
  state.coreInsertedAt = -1;
  if(state.mode === "online"){
    syncOnline();
  } else if(state.mode === "daily" && !currentPlayer().isCPU){
    state.screen = "play";
    triggerCorePulse();
  } else {
    state.screen = "gate";
  }
  render();
}

function render(){
  if(state.screen !== lastChimeScreen){
    if(state.screen === "roundEnd") playRoundEndChime();
    else if(state.screen === "gameOver" || state.screen === "dailyResult") playGameEndChime();
    lastChimeScreen = state.screen;
  }

  // render() fully rebuilds the screen's innerHTML on every call — including
  // ones triggered by things unrelated to what the person is looking at,
  // like the once-a-second Clock tick or an online sync update landing
  // while a popup (Rules, History, etc.) is open. Without this, a rebuild
  // mid-scroll would silently snap the popup's scroll position back to the
  // top, making it impossible to scroll down to the close button.
  const openModal = document.querySelector(".modal");
  const modalScrollTop = openModal ? openModal.scrollTop : null;

  let result;
  if(state.screen === "home") result = renderHome();
  else if(state.screen === "onlineSetup") result = renderOnlineSetup();
  else if(state.screen === "lobby") result = renderLobby();
  else if(state.screen === "setup") result = renderSetup();
  else if(state.screen === "gate") result = renderGate();
  else if(state.screen === "play") result = renderPlay();
  else if(state.screen === "onlinePlay") result = renderOnlinePlay();
  else if(state.screen === "roundEnd") result = renderRoundEnd();
  else if(state.screen === "gameOver") result = renderGameOver();
  else if(state.screen === "dailyResult") result = renderDailyResult();

  if(modalScrollTop !== null){
    const newModal = document.querySelector(".modal");
    if(newModal) newModal.scrollTop = modalScrollTop;
  }
  return result;
}
