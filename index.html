  render();
}

/* Posts today's result and fetches how it compares to everyone else who has
   played today. Fire on entering the result screen; re-fetching each visit
   keeps the percentile fresh as more people play the same puzzle. */
async function submitAndFetchDailyPercentile(){
  const you = state.players[0];
  const cpu = state.players[1];
  const netScore = you.score - cpu.score;
  const result = { date: state.dailyDate, humanScore: you.score, cpuScore: cpu.score, netScore, name: you.name || "You" };
  storeDailyResult(result);

  const yourWords = (state.wordLog || []).filter(e => e.type === "word" && e.by === you.name);
  const longestWord = yourWords.reduce((best, e) => (e.word && e.word.length > best.length) ? e.word : best, "");
  const eightLetterWords = yourWords.filter(e => e.word && e.word.length === 8).length;

  // Record the local stats entry immediately, before touching the network —
  // this is the source of truth for streaks/games-played and is documented
  // to work independent of Firestore. If it waited on the awaits below,
  // someone who finishes the puzzle and closes the tab (or is on a slow or
  // flaky connection) right after would never get that day recorded at all,
  // breaking their streak even though they genuinely played. The percentile
  // (unknown yet) gets filled in below once/if the fetch actually resolves.
  recordDailyStatsEntry({ date: state.dailyDate, netScore, humanScore: you.score, percentile: null, longestWord, eightLetterWords });

  state.dailyPercentile = null;
  state.dailyBeatComputerPct = null;
  state.dailyHighest = null;
  state.dailyLowest = null;
  state.dailyFetchError = null;
  render();

  if(!db){
    state.dailyFetchError = "not_configured";
    render();
    return;
  }
  try{
    await db.collection("daily_results").add(Object.assign({}, result, {
      clientId: getClientId(),
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    }));
    await fetchDailyPercentileOnly(state.dailyDate, netScore);
  }catch(e){
    console.error("Daily result submit failed:", e);
    state.dailyFetchError = "write_failed";
  }
  updateDailyStatsPercentile(state.dailyDate, state.dailyPercentile);
  render();
}

/* Same percentile + today's-scores lookup as above, minus posting a new
   result — used when showing a returning visitor's already-submitted score
   for today (e.g. they reopened the app later the same day) so it doesn't
   double-count their result while still refreshing how it compares. */
async function fetchDailyPercentileOnly(dateStr, netScore){
  if(!db){ state.dailyFetchError = "not_configured"; return; }
  try{
    const snap = await db.collection("daily_results").where("date", "==", dateStr).get();
    const netScores = snap.docs
      .map(d => d.data())
      .filter(r => typeof r.netScore === "number")
      .map(r => r.netScore);
    if(netScores.length){
      state.dailyFetchError = null;
      const beatenOrTied = netScores.filter(n => n <= netScore).length;
      state.dailyPercentile = Math.round((beatenOrTied / netScores.length) * 100);
      const beatComputer = netScores.filter(n => n > 0).length;
      state.dailyBeatComputerPct = Math.round((beatComputer / netScores.length) * 100);
      state.dailyHighest = Math.max(...netScores);
      state.dailyLowest = Math.min(...netScores);
    }
  }catch(e){
    console.error("Daily percentile fetch failed:", e);
    state.dailyFetchError = "read_failed";
  }
}

function startGame(){
  state.players = [];
  let cpuSeen = 0;
  for(let i=0;i<state.playerCount;i++){
    const isCPU = !!state.cpu[i];
    let defaultName;
    if(isCPU){
      cpuSeen++;
      defaultName = cpuSeen === 1 ? "Computer" : ("Computer " + cpuSeen);
    } else {
      defaultName = "Player " + (i+1);
    }
    state.players.push({
      name: (!isCPU && state.names[i] && state.names[i].trim()) ? state.names[i].trim() : defaultName,
      hand: [],
      wildcards: [],
      score: 0,
      isCPU,
      cpuDifficulty: isCPU ? (state.cpuDifficulty[i] || "native") : undefined,
      color: PLAYER_COLORS[i % PLAYER_COLORS.length],
      timeLeft: 120,
      eliminated: false,
    });
  }
  state.lastRound = null;
  state.nextStarter = 0; // round 1 of a fresh game always starts at seat 0
  state.gameWinner = null;
  state.wordLog = [];
  state.openWordDefs.clear();
  state.roundNum = 0;
  newAnalyticsSession();
  logEvent("game_started", {
    playerCount: state.playerCount,
    cpuCount: state.cpu.filter(Boolean).length,
    clockMode: !!state.clockMode,
  });
  dealRound();
  state.currentPlayer = 0;
  state.screen = "gate";
  render();
}

/* rebuilds the deck and deals a fresh hand to every existing player, keeping their scores */
function dealRound(){
  state.deck = buildDeck(state.mode === "daily" ? state.dailyRng : undefined);
  state.discard = [];

  state.players.forEach(p=>{
    if(p.eliminated){ p.hand = []; p.wildcards = []; return; }
    p.hand = state.deck.splice(0,7);
    p.wildcards = [
      { id: nextId(), kind:"wildcard", assignedLetter:null },
      { id: nextId(), kind:"wildcard", assignedLetter:null },
    ];
  });

  state.core = state.deck.shift();
  state.builder = [];
  state.coreInsertedAt = -1;
  state.lastPlay = null;

  state.roundNum = (state.roundNum || 0) + 1;
  logEvent("round_started", {
    roundNum: state.roundNum,
    coreLetter: displayLetter(state.core),
  });
}

/* ============================= ONLINE MULTIPLAYER ============================= */

/* reads ?room=CODE from the URL, e.g. from a link the host shared */
function getRoomCodeFromURL(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get("room");
  return code ? code.trim().toUpperCase() : null;
}

function buildInviteLink(code){
  return window.location.origin + window.location.pathname + "?room=" + code;
}

function getClientId(){
  let id = localStorage.getItem("endlink_client_id");
  if(!id){
    id = "c_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("endlink_client_id", id);
  }
  return id;
}

function makeRoomCode(){
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ"; // no I/O — avoids confusion
  let code = "";
  for(let i=0;i<4;i++) code += letters[Math.floor(Math.random()*letters.length)];
  return code;
}

function createRoom(){
  if(!FIREBASE_CONFIGURED){ state.online.error = "Firebase isn't set up yet — see the setup comment near the top of this file's <script>."; render(); return; }
  const name = (state.online.myName||"").trim() || "Player 1";
  const maxPlayers = state.online.maxPlayers;
  const code = makeRoomCode();
  const clientId = getClientId();
  const seats = Array.from({length:maxPlayers}, ()=>({name:null,isCPU:false,clientId:null}));
  seats[0] = { name, isCPU:false, clientId };
  db.collection("rooms").doc(code).set({
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    maxPlayers, hostClientId: clientId, status: "lobby", seats, game: null,
  }).then(()=>{
    localStorage.setItem("endlink_online_session", JSON.stringify({code, clientId}));
    state.online.code = code;
    state.online.clientId = clientId;
    state.online.mySeat = 0;
    state.online.isHost = true;
    state.online.error = null;
    state.screen = "lobby";
    listenToRoom(code);
    render();
  }).catch(err=>{
    state.online.error = "Couldn't create room: " + err.message;
    render();
  });
}

function joinRoom(){
  if(!FIREBASE_CONFIGURED){ state.online.error = "Firebase isn't set up yet — see the setup comment near the top of this file's <script>."; render(); return; }
  const code = (state.online.joinCodeInput||"").trim().toUpperCase();
  const name = (state.online.myName||"").trim() || "Player";
  if(!code){ state.online.error = "Enter a room code."; render(); return; }
  const clientId = getClientId();
  const ref = db.collection("rooms").doc(code);
  db.runTransaction(async (tx)=>{
    const doc = await tx.get(ref);
    if(!doc.exists) throw new Error("No room with that code.");
    const data = doc.data();
    if(data.status !== "lobby") throw new Error("That game has already started.");
    const seats = data.seats.slice();
    let seatIdx = seats.findIndex(s=>s.clientId === clientId);
    if(seatIdx === -1){
      seatIdx = seats.findIndex(s=>!s.clientId);
      if(seatIdx === -1) throw new Error("That room is full.");
      seats[seatIdx] = { name, isCPU:false, clientId };
      tx.update(ref, { seats });
    }
    return { seatIdx, hostClientId: data.hostClientId };
  }).then(({seatIdx, hostClientId})=>{
    localStorage.setItem("endlink_online_session", JSON.stringify({code, clientId}));
    state.online.code = code;
    state.online.clientId = clientId;
    state.online.mySeat = seatIdx;
    state.online.isHost = (clientId === hostClientId);
    state.online.error = null;
    state.screen = "lobby";
    listenToRoom(code);
    render();
  }).catch(err=>{
    state.online.error = err.message;
    render();
  });
}

/* host-only: fill or clear an empty lobby seat with a Computer player */
function setSeatCPU(seatIdx, isCPU){
  if(!state.online.isHost) return;
  const seats = state.online.seats.slice();
  seats[seatIdx] = isCPU
    ? { name: null, isCPU: true, clientId: "CPU_" + seatIdx + "_" + Date.now(), difficulty: "native" }
    : { name: null, isCPU: false, clientId: null };
  db.collection("rooms").doc(state.online.code).update({ seats });
}

/* host-only: change an already-CPU seat's difficulty (beginner | native | genius) */
function setSeatDifficulty(seatIdx, level){
  if(!state.online.isHost) return;
  const seats = state.online.seats.slice();
  if(!seats[seatIdx] || !seats[seatIdx].isCPU) return;
  seats[seatIdx] = Object.assign({}, seats[seatIdx], { difficulty: level });
  db.collection("rooms").doc(state.online.code).update({ seats });
}

/* host-only: deal the first hand and move the room from "lobby" to "playing" */
function startOnlineGame(){
  if(!state.online.isHost) return;
  const seats = state.online.seats;
  if(seats.some(s=>!s.clientId && !s.isCPU)) return; // guard — button should already be disabled

  state.players = [];
  let cpuSeen = 0;
  seats.forEach((s,i)=>{
    const color = PLAYER_COLORS[i % PLAYER_COLORS.length];
    if(s.isCPU){
      cpuSeen++;
      const defaultName = cpuSeen === 1 ? "Computer" : ("Computer " + cpuSeen);
      state.players.push({ name: defaultName, hand:[], wildcards:[], score:0, isCPU:true, cpuDifficulty: s.difficulty || "native", color, timeLeft:120, eliminated:false });
    } else {
      state.players.push({ name: s.name || ("Player " + (i+1)), hand:[], wildcards:[], score:0, isCPU:false, color, timeLeft:120, eliminated:false });
    }
  });
  state.lastRound = null;
  state.nextStarter = 0; // round 1 of a fresh game always starts at seat 0
  state.gameWinner = null;
  state.wordLog = [];
  state.openWordDefs.clear();
  state.roundNum = 0;
  newAnalyticsSession();
  logEvent("game_started", {
    playerCount: state.players.length,
    cpuCount: state.players.filter(pl=>pl.isCPU).length,
    clockMode: !!state.clockMode,
  });
  dealRound();
  state.currentPlayer = 0;
  state.screen = "onlinePlay";
  syncOnline();
  render();
}

/* subscribes this client to the room doc; every field it reads back into
   `state` mirrors what's on Firestore, so all phones converge on the same view */
function listenToRoom(code){
  if(state.online.unsub) state.online.unsub();
  state.online.unsub = db.collection("rooms").doc(code).onSnapshot(doc=>{
    if(!doc.exists){
      state.online.error = "This room no longer exists.";
      state.screen = "onlineSetup";
      render();
      return;
    }
    const data = doc.data();
    state.online.seats = data.seats;
    state.online.maxPlayers = data.maxPlayers;
    state.online.isHost = data.hostClientId === state.online.clientId;

    if(data.status === "lobby"){
      state.screen = "lobby";
    } else {
      applyIncomingGame(data.game);
      state.builder = [];
      state.coreInsertedAt = -1;
      if(data.status === "playing") state.screen = "onlinePlay";
      else if(data.status === "roundEnd") state.screen = "roundEnd";
      else if(data.status === "gameOver") state.screen = "gameOver";
    }
    render();
  });
}

function applyIncomingGame(g){
  if(!g) return;
  state.players = g.players;
  state.deck = g.deck;
  state.discard = g.discard;
  state.core = g.core;
  state.currentPlayer = g.currentPlayer;
  state.lastRound = g.lastRound;
  state.lastPlay = g.lastPlay || null;
  state.nextStarter = g.nextStarter;
  state.gameWinner = g.gameWinner;
  state.wordLog = g.wordLog || [];
}

/* pushes the local, already-mutated shared game fields up to Firestore so
   every other phone's listener picks up the change. Safe to call from local
   (pass & play) code paths too — it's a no-op unless mode is "online". */
function syncOnline(){
  if(state.mode !== "online" || !state.online.code || !db) return;
  const status = state.screen === "roundEnd" ? "roundEnd" : state.screen === "gameOver" ? "gameOver" : "playing";
  db.collection("rooms").doc(state.online.code).update({
    status,
    game: {
      players: state.players,
      deck: state.deck,
      discard: state.discard,
      core: state.core,
      currentPlayer: state.currentPlayer,
      lastRound: state.lastRound,
      lastPlay: state.lastPlay || null,
      nextStarter: state.nextStarter,
      gameWinner: state.gameWinner,
      wordLog: state.wordLog || [],
    },
  }).catch(err=>{
    console.error("At Last sync error:", err);
    showToast("Connection hiccup — your move may not have reached everyone yet.");
  });
}

function leaveOnlineRoom(){
  stopClock();
  if(state.online.unsub){ state.online.unsub(); }
  localStorage.removeItem("endlink_online_session");
  state.mode = "local";
  state.online = { code:null, clientId:null, mySeat:-1, isHost:false, seats:[], maxPlayers:4, myName:"", joinCodeInput:"", error:null, unsub:null, fromInvite:false };
  state.screen = "home";
  render();
}

/* used from mid-game screens, where leaving can strand the other players
   (especially if it's your turn) — a lobby/game-over "leave" doesn't need this */
function confirmLeaveOnlineRoom(){
  if(window.confirm("Leave this game? If it's your turn, the other players will be stuck waiting.")){
    leaveOnlineRoom();
  }
}

/* best-effort: if this phone already had a room open (e.g. the page was
   refreshed), silently rejoin it instead of dropping back to the home screen */
function tryResumeSession(){
  if(!FIREBASE_CONFIGURED) return;
  const raw = localStorage.getItem("endlink_online_session");
  if(!raw) return;
  let saved;
  try{ saved = JSON.parse(raw); } catch(e){ return; }
  if(!saved || !saved.code || !saved.clientId) return;
  state.mode = "online";
  state.online.code = saved.code;
  state.online.clientId = saved.clientId;
  db.collection("rooms").doc(saved.code).get().then(doc=>{
    if(!doc.exists){ localStorage.removeItem("endlink_online_session"); return; }
    const data = doc.data();
    const seatIdx = data.seats.findIndex(s=>s.clientId === saved.clientId);
    if(seatIdx === -1){ localStorage.removeItem("endlink_online_session"); return; }
    state.online.mySeat = seatIdx;
    state.online.isHost = data.hostClientId === saved.clientId;
    listenToRoom(saved.code);
  }).catch(()=>{});
}

/* ============================= HELPERS ============================= */

function currentPlayer(){ return state.players[state.currentPlayer]; }

/* end-of-round value of a player's remaining hand: 1 point per card left, plus a
   5-point bonus for every Wildcard still in hand (no letter-value calculations
   are used anymore — scoring only depends on card counts). */
function remainingHandPoints(p){
  return p.hand.length + p.wildcards.length*5;
}

function displayLetter(card){
  if(card.kind === "letter") return card.letter;
  if(card.assignedLetter) return card.assignedLetter;
  return "?";
}

function drawFromDeck(n=1){
  const out = [];
  for(let i=0;i<n;i++){
    if(state.deck.length===0){
      if(state.discard.length===0) break;
      state.deck = shuffle(state.discard, state.mode === "daily" ? state.dailyRng : undefined);
      state.discard = [];
    }
    if(state.deck.length>0) out.push(state.deck.shift());
  }
  return out;
}

/* ============================= CPU PLAYER AI ============================= */

function wordPoolForDifficulty(level){
  if(level === "beginner") return BEGINNER_WORDS;
  if(level === "native") return NATIVE_WORDS;
  return DICTIONARY; // "genius" (and the default/fallback) — unrestricted
}

const WORDS_BY_LENGTH_CACHE = {}; // keyed by difficulty level, built lazily per tier
function getWordsByLength(level){
  const key = level || "genius";
  if(WORDS_BY_LENGTH_CACHE[key]) return WORDS_BY_LENGTH_CACHE[key];
  const map = {};
  wordPoolForDifficulty(key).forEach(w=>{
    const len = w.length;
    if(!map[len]) map[len] = [];
    map[len].push(w);
  });
  WORDS_BY_LENGTH_CACHE[key] = map;
  return map;
}

/* Given a target word and a chosen letter for the core card, work out whether the
   player's hand + wildcards can supply the rest. Returns a plan or null. */
function tryPlanFixed(word, handLetterCards, wildCards, coreLetter){
  const counts = {};
  word.split("").forEach(l=>{ counts[l] = (counts[l]||0) + 1; });
  if(!counts[coreLetter]) return null;
  counts[coreLetter]--;

  const availableHand = handLetterCards.slice();
  const usedHandCards = [];
  Object.keys(counts).forEach(letter=>{
    while(counts[letter] > 0){
      const idx = availableHand.findIndex(c=>c.letter===letter);
      if(idx===-1) break;
      usedHandCards.push(availableHand[idx]);
      availableHand.splice(idx,1);
      counts[letter]--;
    }
  });

  const remainingLetters = [];
  Object.keys(counts).forEach(l=>{ for(let i=0;i<counts[l];i++) remainingLetters.push(l); });
  if(remainingLetters.length > wildCards.length) return null;

  return {
    coreLetter,
    usedHandCards,
    usedWildcards: wildCards.slice(0, remainingLetters.length),
    wildAssignments: remainingLetters,
  };
}

function tryPlanForWord(word, handLetterCards, wildCards, coreIsWild, coreLetter){
  if(coreIsWild){
    const distinctLetters = [...new Set(word.split(""))];
    for(const cl of distinctLetters){
      const plan = tryPlanFixed(word, handLetterCards, wildCards, cl);
      if(plan) return plan;
    }
    return null;
  }
  return tryPlanFixed(word, handLetterCards, wildCards, coreLetter);
}

/* Search for the longest playable word (ties broken randomly) for the given player. */
function planAIMove(p){
  const coreIsWild = state.core.kind !== "letter";
  const coreLetter = coreIsWild ? null : state.core.letter;
  const wordsByLength = getWordsByLength(p.cpuDifficulty || "genius");
  // Max reachable length is hand letters + wildcards + the core letter itself.
  // Using hand.length alone here used to undercount whenever the hand had
  // shrunk to 1-2 cards (exactly when a player is leaning on wildcards) —
  // maxLen could drop below 3, so the search loop below never ran even once,
  // reporting "no word found" even though the core + wildcards alone could
  // have made a valid 3-letter word.
  const maxLen = Math.min(p.hand.length + p.wildcards.length + 1, 8);

  for(let len = maxLen; len >= 3; len--){
    const candidates = wordsByLength[len];
    if(!candidates || candidates.length === 0) continue;
    const shuffled = shuffle(candidates, state.mode === "daily" ? state.dailyRng : undefined);
    for(const word of shuffled){
      const plan = tryPlanForWord(word, p.hand, p.wildcards, coreIsWild, coreLetter);
      if(plan) return { word, plan };
    }
  }
  return null;
}

/* Turns a word + plan into an actual builder array (mirrors what a human would
   assemble by tapping tiles), assigning wildcard letters along the way. */
function assembleBuilder(word, plan){
  plan.usedWildcards.forEach((card, i)=>{ card.assignedLetter = plan.wildAssignments[i]; });

  const handPool = plan.usedHandCards.slice();
  const wildPool = plan.usedWildcards.slice();
  const builder = [];
  let coreInsertedAt = -1;
  let coreConsumed = false;

  for(let i=0;i<word.length;i++){
    const ch = word[i];
    if(!coreConsumed && ch === plan.coreLetter){
      if(state.core.kind !== "letter") state.core.assignedLetter = plan.coreLetter;
      builder.push(state.core);
      coreInsertedAt = i;
      coreConsumed = true;
      continue;
    }
    const handIdx = handPool.findIndex(c=>c.letter===ch);
    if(handIdx !== -1){
      builder.push(handPool[handIdx]);
      handPool.splice(handIdx,1);
      continue;
    }
    const wildIdx = wildPool.findIndex(c=>c.assignedLetter===ch);
    if(wildIdx !== -1){
      builder.push(wildPool[wildIdx]);
      wildPool.splice(wildIdx,1);
      continue;
    }
    return null; // shouldn't happen if the plan was built correctly
  }
  if(!coreConsumed) return null;
  return { builder, coreInsertedAt };
}

/* Runs one full CPU turn: find the best word it can play, or draw a wildcard,
   or pass if truly stuck. */
function playAITurn(){
  if(state.mode === "online" && !state.online.isHost) return;
  const p = currentPlayer();
  // Mark which player this AI turn belongs to. Some paths below (showToast,
  // via commitWord/drawCard/the pass branch) call render() synchronously
  // *before* advanceTurn() runs, while we're still on this same player's
  // "gate" screen. renderGate()'s scheduling check uses this marker (rather
  // than just _aiScheduled) so those intermediate renders don't sneak in a
  // duplicate timer for this same turn — which would otherwise consume the
  // "not yet scheduled" slot and leave the *next* player's turn never
  // scheduled at all once advanceTurn() moves on.
  state._aiTurnPlayer = state.currentPlayer;
  const found = planAIMove(p);
  if(found){
    const assembled = assembleBuilder(found.word, found.plan);
    if(assembled){
      state.builder = assembled.builder;
      state.coreInsertedAt = assembled.coreInsertedAt;
      commitWord();
      state._aiTurnPlayer = -1;
      return;
    }
  }
  if(p.wildcards.length < 2){
    drawCard();
  } else {
    showToast(p.name + " couldn't find a play and passed.");
    advanceTurn();
  }
  state._aiTurnPlayer = -1;
}

function showToast(msg, ms=2600){
  state.toast = msg;
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ state.toast=null; render(); }, ms);
}

// Briefly pulses the Core Card to draw the eye to it right as a turn begins.
// Safe to call either from an event handler (it doesn't render itself — the
// caller is expected to render right after) or from mid-render (the flag is
// read later in the same render pass), since it only flips state and starts
// a timer to clear itself back off.
function triggerCorePulse(){
  state.corePulse = true;
  clearTimeout(triggerCorePulse._t);
  triggerCorePulse._t = setTimeout(()=>{ state.corePulse = false; render(); }, 600);
}

/* --- Clock mode ---------------------------------------------------------
   Each player gets a 2-minute budget for the whole game (not per turn or
   per round). The countdown only runs while it's actually that player's
   turn on the board — it starts the moment they land on the play screen
   and stops the moment they submit a word or draw a wildcard (both of
   which end their turn). One shared interval handle drives the tick;
   clockTick() is defensive about screen/mode so a stray leftover timer
   just quietly stops itself instead of doing anything harmful. */
let clockTimer = null;

function formatClock(seconds){
  const s = Math.max(0, Math.floor(seconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ":" + String(r).padStart(2, "0");
}

function stopClock(){
  clearInterval(clockTimer);
  clockTimer = null;
}

function startClock(){
  stopClock();
  if(!state.clockMode) return;
  clockTimer = setInterval(clockTick, 1000);
}

function clockTick(){
  if(!state.clockMode || (state.screen !== "play" && state.screen !== "onlinePlay")){
    stopClock();
    return;
  }
  const p = currentPlayer();
  if(!p){ stopClock(); return; }
  if(p.timeLeft == null) p.timeLeft = 120;
  p.timeLeft = Math.max(0, p.timeLeft - 1);
  if(p.timeLeft <= 0){
    stopClock();
    p.eliminated = true;
    if(!state.wordLog) state.wordLog = [];
    state.wordLog.push({ type:"eliminated", by: p.name, color: p.color });
    logEvent("player_eliminated", { playerIsCPU: !!p.isCPU });

    const remaining = state.players.filter(pl => !pl.eliminated);
    if(remaining.length <= 1){
      const winner = remaining[0] || p;
      showToast(p.name + " ran out of time and is out of the game!");
      state.gameWinner = winner.name;
      state.wordLog.push({ type:"eliminationWin", by: winner.name, color: winner.color });
      state.screen = "gameOver";
      logEvent("game_ended", {
        winner: winner.name,
        winMethod: "elimination",
        totalRounds: state.roundNum,
      });
      if(state.mode === "online") syncOnline();
      render();
      return;
    }

    showToast(p.name + " ran out of time and is out of the game!");
    state.builder = [];
    state.coreInsertedAt = -1;
    advanceTurn();
    return;
  }
  render();
}

function setClockMode(on){
  state.clockMode = on;
  try{ localStorage.setItem("endlink_clock_mode", on ? "1" : "0"); }catch(e){ /* ignore */ }
  if(on && (state.screen === "play" || state.screen === "onlinePlay")){
    startClock();
  } else {
    stopClock();
  }
}

function setAnalyticsEnabled(on){
  state.analyticsEnabled = on;
  try{ localStorage.setItem("endlink_analytics_opt_out", on ? "0" : "1"); }catch(e){ /* ignore */ }
}

// Ring of emoji exploding outward from the center of the word box, used for
// the extra-special celebration when a player plays a full 8-letter word.
// Each particle gets a random angle/distance/rotation computed here (at
// render time) rather than in CSS, since render() rebuilds fresh markup
// every call anyway — same approach as winnerSparkleField().
function epicSparkles(){
  if(!state.epicWord) return "";
  const glyphs = ["🎉","🎊","✨","🌟","💥","🏆","🔥","⭐","🌈","💫","🎆","🎇"];
  const count = 14;
  let spans = "";
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2 * i/count) + (Math.random()*0.5 - 0.25);
    const dist = 85 + Math.random()*75;
    const ex = (Math.cos(angle)*dist).toFixed(0);
    const ey = (Math.sin(angle)*dist).toFixed(0);
    const rot = (Math.random()*300 - 150).toFixed(0);
    const delay = (Math.random()*0.18).toFixed(2);
    spans += `<span class="epic-sparkle" style="--ex:${ex}px;--ey:${ey}px;--er:${rot}deg;animation-delay:${delay}s;">${glyphs[i % glyphs.length]}</span>`;
  }
  return spans;
}

function wordString(){
  return state.builder.map(displayLetter).join("");
}

/* ============================= BUILDER LOGIC ============================= */

function addHandCardToBuilder(card){
  if(card.kind !== "letter" && !card.assignedLetter){
    state.pendingWildAssign = { forCore:false, card };
    render();
    return;
  }
  state.builder.push(card);
  render();
}

function insertCoreIntoBuilder(){
  if(state.coreInsertedAt !== -1){ showToast("Already placed in your word."); return; }
  if(state.core.kind !== "letter" && !state.core.assignedLetter){
    state.pendingWildAssign = { forCore:true, card: state.core };
    render();
    return;
  }
  state.builder.push(state.core);
  state.coreInsertedAt = state.builder.length - 1;
  render();
}

function assignWildLetter(letter){
  const pending = state.pendingWildAssign;
  if(!pending) return;
  pending.card.assignedLetter = letter;
  state.pendingWildAssign = null;
  if(pending.forCore){
    state.builder.push(pending.card);
    state.coreInsertedAt = state.builder.length - 1;
  } else {
    state.builder.push(pending.card);
  }
  render();
}

function cancelWildAssign(){
  state.pendingWildAssign = null;
  render();
}

function removeLastFromBuilder(){
  if(state.builder.length===0) return;
  const removed = state.builder.pop();
  if(state.coreInsertedAt === state.builder.length){ state.coreInsertedAt = -1; }
  if(removed.assignedLetter) removed.assignedLetter = null;
  render();
}

function removeBuilderIndex(idx){
  if(idx < 0 || idx >= state.builder.length) return;
  const removed = state.builder[idx];
  state.builder.splice(idx, 1);
  if(state.coreInsertedAt === idx){ state.coreInsertedAt = -1; }
  else if(state.coreInsertedAt > idx){ state.coreInsertedAt -= 1; }
  if(removed.assignedLetter) removed.assignedLetter = null;
  render();
}

function shuffleHand(){
  const p = state.mode === "online" ? state.players[state.online.mySeat] : currentPlayer();
  for(let i = p.hand.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [p.hand[i], p.hand[j]] = [p.hand[j], p.hand[i]];
  }
  render();
}

function cardInBuilder(card){
  return state.builder.includes(card);
}

function isValidWord(word){
  if(!word || word.length < 3) return false;
  return DICTIONARY.has(word.toUpperCase());
}

function canSubmit(){
  return state.builder.length >= 3;
}

/* ============================= PLAY WORD ============================= */

function bonusDrawAmount(wordLength){
  if(wordLength >= 5) return 2;
  if(wordLength === 4) return 1;
  return 0; // 3-letter word
}

/* In online mode, only two clients are ever allowed to drive a turn-action
   function: the player whose turn it actually is, or the host acting on
   behalf of a Computer player (playAITurn always runs on the host's phone).
   Blocking anyone else here is what stops two phones from acting at once. */
function onlineTurnAuthorized(){
  if(state.mode !== "online") return true;
  if(state.online.mySeat === state.currentPlayer) return true;
  const cp = state.players[state.currentPlayer];
  return !!(state.online.isHost && cp && cp.isCPU);
}

function attemptSubmit(){
  if(!onlineTurnAuthorized()) return;
  if(!canSubmit()) return;
  if(state.coreInsertedAt === -1){
    state.coreShake = true;
    showToast("Include the last letter of the previously played word.");
    render();
    clearTimeout(attemptSubmit._coreShakeTimer);
    attemptSubmit._coreShakeTimer = setTimeout(()=>{ state.coreShake = false; render(); }, 500);
    logEvent("word_attempt_failed", {
      reason: "missing_core_letter",
      coreLetter: displayLetter(state.core),
      attemptedWord: wordString(),
    });
    return;
  }
  const word = wordString();
  if(!isValidWord(word)){
    state.shakeWord = true;
    render();
    clearTimeout(attemptSubmit._shakeTimer);
    attemptSubmit._shakeTimer = setTimeout(()=>{ state.shakeWord = false; render(); }, 500);
    logEvent("word_attempt_failed", {
      reason: "not_in_dictionary",
      coreLetter: displayLetter(state.core),
      attemptedWord: word,
      wordLength: word.length,
    });
    return;
  }
  state.successWord = true;
  state.epicWord = word.length >= 8;
  render();
  clearTimeout(attemptSubmit._successTimer);
  attemptSubmit._successTimer = setTimeout(()=>{
    state.successWord = false;
    state.epicWord = false;
    commitWord();
  }, state.epicWord ? 1150 : 550);
}

function commitWord(){
  stopClock();
  const p = currentPlayer();
  if(state.clockMode) p.timeLeft = (p.timeLeft ?? 120) + 10;
  const word = wordString();
  const lastCard = state.builder[state.builder.length-1];
  const playedCards = state.builder.filter(c => c !== lastCard);

  // snapshot the play (letters + which tiles were wildcards/the core) so the
  // next player's "pass the device" screen can show it before they see their hand
  state.lastPlay = {
    by: p.name,
    tiles: state.builder.map((c, idx) => ({
      letter: displayLetter(c),
      wild: c.kind !== "letter",
      core: idx === state.coreInsertedAt
    }))
  };

  // Score the word: 1 point for every letter played except the final letter
  // (which becomes the new Core Card). Wildcards never score.
  const wordPoints = playedCards.filter(c => c.kind === "letter").length;
  p.score += wordPoints;

  if(!state.wordLog) state.wordLog = [];
  state.wordLog.push({ type:"word", word, by: p.name, points: wordPoints, color: p.color });

  // remove used cards from hand, mark wildcard loadout as spent if used (any wildcard in builder that isn't core-carried forward and came from hand)
  const usedFromHand = state.builder.filter(c => c !== state.core);
  p.hand = p.hand.filter(c => !usedFromHand.includes(c));

  usedFromHand.forEach(c=>{
    if(c.kind === "wildcard") p.wildcards = p.wildcards.filter(w => w !== c);
  });

  logEvent("word_played", {
    word,
    wordLength: word.length,
    points: wordPoints,
    coreLetter: displayLetter(state.core),
    corePosition: corePositionBucket(state.coreInsertedAt, state.builder.length),
    wildcardsUsed: usedFromHand.filter(c => c.kind === "wildcard").length,
    playerIsCPU: !!p.isCPU,
  });

  // discard played letter cards (this feeds the reshuffle when the deck runs low).
  // Wildcards are never discarded into the letter deck — once played they're
  // simply returned to the (unlimited) Wildcard deck and cease to exist as a card.
  playedCards.forEach(c=>{
    if(c.kind === "letter") state.discard.push(c);
  });

  // set new core
  state.core = lastCard;
  if(state.core.kind !== "letter") state.core.assignedLetter = null;

  // check round end (before any bonus draw, since drawing never applies once hand is empty)
  if(p.hand.length === 0){
    let roundPoints = 0;
    let breakdown = [];
    state.players.forEach((pl)=>{
      if(pl === p) return;
      const val = remainingHandPoints(pl);
      breakdown.push({ name: pl.name, value: val });
      roundPoints += val;
    });
    p.score += roundPoints;
    state.lastRound = { winner: p.name, points: roundPoints, breakdown, word };

    // Next round starts with whoever comes right after THIS round's starter,
    // in seat order — a fixed rotation rather than a performance-based pick
    // (it used to be "worst remaining hand starts next round"). Simulation
    // testing showed rotation nearly eliminates the built-in advantage of
    // going earlier in turn order, while "worst hand" didn't correct for it
    // at all. state.nextStarter still holds THIS round's starter here (it's
    // only overwritten at a round boundary, right below), so rotate from
    // that; skip over any eliminated (Clock Mode) player the same way
    // advanceTurn() already does.
    let rotated = (state.nextStarter + 1) % state.players.length;
    while(state.players[rotated].eliminated && state.players.some(pl => !pl.eliminated)){
      rotated = (rotated + 1) % state.players.length;
    }
    state.nextStarter = rotated;

    if(!state.wordLog) state.wordLog = [];
    state.wordLog.push({ type:"roundBonus", by: p.name, points: roundPoints, color: p.color });

    logEvent("round_ended", {
      roundNum: state.roundNum,
      bonusPoints: roundPoints,
      wildcardsHeldByLosers: state.players.filter(pl => pl !== p).map(pl => pl.wildcards.length),
    });

    // Check every player's score, not just the one who emptied their hand —
    // other players' scores can also have crossed the target score (e.g. from
    // an earlier round) even though only p's score changed this turn.
    const champion = checkForWinner();

    if(champion){
      state.gameWinner = champion.name;
      state.screen = state.mode === "daily" ? "dailyResult" : "gameOver";
      logEvent("game_ended", {
        winner: champion.name,
        winMethod: "score",
        totalRounds: state.roundNum,
      });
    } else {
      state.screen = "roundEnd";
    }
    syncOnline();
    render();
    return;
  }

  state.builder = [];
  state.coreInsertedAt = -1;

  const bonus = bonusDrawAmount(word.length);
  let msg = p.name + " played \"" + word + "\" (+" + wordPoints + "). New Core Card: " + displayLetter(state.core) + ".";
  if(bonus > 0){
    const drawn = drawFromDeck(bonus);
    p.hand.push(...drawn);
    msg += " Bonus: drew " + drawn.length + " card" + (drawn.length===1?"":"s") + "!";
  }
  showToast(msg);
  advanceTurn();
}

function drawCard(){
  if(!onlineTurnAuthorized()) return;
  const p = currentPlayer();
  if(p.wildcards.length >= 2){
    showToast("You already have 2 Wildcards. Play a word instead.");
    logEvent("wildcard_capped", { coreLetter: displayLetter(state.core), handSize: p.hand.length });
    render();
    return;
  }
  p.wildcards.push({ id: nextId(), kind:"wildcard", assignedLetter:null });
  if(!state.wordLog) state.wordLog = [];
  state.wordLog.push({ type:"wildcard", by: p.name, color: p.color });
  logEvent("wildcard_drawn", {
    coreLetter: displayLetter(state.core),
    handSize: p.hand.length,
    wildcardsHeldAfter: p.wildcards.length,
    playerIsCPU: !!p.isCPU,
  });
  showToast(p.name + " drew a Wildcard.");
  stopClock();
  if(state.clockMode) p.timeLeft = (p.timeLeft ?? 120) + 10;
  advanceTurn();
}

function advanceTurn(){
  // Skip past any eliminated (timed-out) players — they no longer take
  // turns. The `some` guard just prevents a runaway loop in the degenerate
  // case where everyone is eliminated; in normal play the game already
  // ends the instant only one active player remains, so this loop only
  // ever needs to skip over players, never search through all of them.
  do {
    state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
  } while(state.players[state.currentPlayer].eliminated && state.players.some(pl => !pl.eliminated));
  state.builder = [];
  state.coreInsertedAt = -1;
  if(state.mode === "online"){
    syncOnline();
  } else if(state.mode === "daily" && !currentPlayer().isCPU){
    state.screen = "play";
    triggerCorePulse();
  } else {
    state.screen = "gate";
  }
  render();
}

/* ============================= WORD DEFINITIONS ============================
   Short glosses for the Recap popup — tap a played word to see what it means.
   Sourced from the Open English Wordnet (https://en-word.net, CC BY 4.0):
   built ahead of time into definitions.json, a flat WORD -> short-definition
   map covering this game's own DICTIONARY. Not every word has an entry —
   OEWN is a general-purpose lexical resource, and this game's word list
   includes plenty of obscure/technical Scrabble-legal words it simply
   doesn't define; tapping one of those shows a plain "no definition found"
   instead of an error.
   Fetched lazily — only once someone actually taps a word — then cached in
   memory (WORD_DEFINITIONS) for the rest of the session, so it's one fetch
   per visit rather than per word. Kept as a separate file instead of inline
   in this HTML (like the embedded DICTIONARY above) so it doesn't weigh
   down every page load — most sessions never open Recap at all. */
let WORD_DEFINITIONS = null;
let definitionsLoadPromise = null;
let definitionsError = null;

function loadDefinitions(){
  if(WORD_DEFINITIONS) return Promise.resolve(WORD_DEFINITIONS);
  if(definitionsLoadPromise) return definitionsLoadPromise;
  definitionsError = null;
  definitionsLoadPromise = fetch("definitions.json")
    .then(res => { if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(data => { WORD_DEFINITIONS = data; return data; })
    .catch(err => {
      definitionsLoadPromise = null;
      definitionsError = err;
      throw err;
    });
  return definitionsLoadPromise;
}

function toggleWordDef(idx){
  if(state.openWordDefs.has(idx)){
    state.openWordDefs.delete(idx);
    render();
    return;
  }
  state.openWordDefs.add(idx);
  render();
  loadDefinitions().then(render).catch(render);
}

function wordDefContent(word){
  if(WORD_DEFINITIONS){
    const def = WORD_DEFINITIONS[word.toUpperCase()];
    return def
      ? escapeHtml(def)
      : `<span class="word-def-muted">No definition found for "${escapeHtml(word)}".</span>`;
  }
  if(definitionsError){
    return `<span class="word-def-muted">Couldn't load definitions — check your connection.</span>`;
  }
  return `<span class="word-def-muted">Loading definition…</span>`;
}

function wireWordDefToggles(){
  document.querySelectorAll("[data-def-idx]").forEach(el=>{
    el.onclick = ()=>{ toggleWordDef(parseInt(el.dataset.defIdx)); };
  });
}

function wordLogRows(){
  if(!state.wordLog || !state.wordLog.length){
    return `<p style="color:var(--text-muted);font-weight:600;">No words played yet.</p>`;
  }
  // newest first, so the most recent play is visible without scrolling —
  // i is each entry's stable position in state.wordLog itself (not its
  // position in this reversed list), so an expanded definition stays
  // attached to the right row as new words get added to the log.
  return state.wordLog.map((entry, i) => [i, entry]).reverse().map(([i, entry]) => entry.type === "wildcard" ? `
    <div class="cards-row">
      <div class="words-log-top">
        <span class="cards-row-name">🎴 Drew a Wildcard</span>
      </div>
      <div class="cards-row-stats" style="color:${entry.color || 'var(--text-muted)'};">${escapeHtml(entry.by)}</div>
    </div>
  ` : entry.type === "eliminated" ? `
    <div class="cards-row">
      <div class="words-log-top">
        <span class="cards-row-name">⏱ Ran out of time — eliminated</span>
      </div>
      <div class="cards-row-stats" style="color:${entry.color || 'var(--text-muted)'};">${escapeHtml(entry.by)}</div>
    </div>
  ` : entry.type === "eliminationWin" ? `
    <div class="cards-row">
      <div class="words-log-top">
        <span class="cards-row-name">🏆 Last one standing — wins the game!</span>
      </div>
      <div class="cards-row-stats" style="color:${entry.color || 'var(--text-muted)'};">${escapeHtml(entry.by)}</div>
    </div>
  ` : entry.type === "roundBonus" ? `
    <div class="cards-row">
      <div class="words-log-top">
        <span class="cards-row-name">🏆 Round-ending bonus</span>
        <span class="words-log-points mono" style="color:${entry.color || 'var(--violet)'};">+${entry.points} point${entry.points===1?"":"s"}</span>
      </div>
      <div class="cards-row-stats" style="color:${entry.color || 'var(--text-muted)'};">${escapeHtml(entry.by)}</div>
    </div>
  ` : `
    <div class="cards-row">
      <div class="words-log-top">
        <button class="cards-row-name word-term" data-def-idx="${i}">${escapeHtml(entry.word)}</button>
        <span class="words-log-points mono" style="color:${entry.color || 'var(--violet)'};">+${entry.points} point${entry.points===1?"":"s"}</span>
      </div>
      <div class="cards-row-stats" style="color:${entry.color || 'var(--text-muted)'};">${escapeHtml(entry.by)}</div>
      ${state.openWordDefs.has(i) ? `<div class="word-def">${wordDefContent(entry.word)}</div>` : ""}
    </div>
  `).join("");
}

function submitFeedback(){
  const message = (state.feedbackDraft.message || "").trim();
  if(!message){
    state.feedbackError = "Add a line or two before sending — even a quick thought helps!";
    render();
    return;
  }
  if(!db){
    state.feedbackError = "Can't reach the server right now — mind trying again in a moment?";
    render();
    return;
  }
  const name = (state.feedbackDraft.name || "").trim();
  setFeedbackName(name);
  state.feedbackSending = true;
  state.feedbackError = null;
  render();
  db.collection("feedback").add({
    name: name || null,
    message,
    screen: state.screen,
    mode: state.mode,
    clientId: getClientId(),

function render(){
  if(state.screen !== lastChimeScreen){
    if(state.screen === "roundEnd") playRoundEndChime();
    else if(state.screen === "gameOver" || state.screen === "dailyResult") playGameEndChime();
    lastChimeScreen = state.screen;
  }

  // render() fully rebuilds the screen's innerHTML on every call — including
  // ones triggered by things unrelated to what the person is looking at,
  // like the once-a-second Clock tick or an online sync update landing
  // while a popup (Rules, History, etc.) is open. Without this, a rebuild
  // mid-scroll would silently snap the popup's scroll position back to the
  // top, making it impossible to scroll down to the close button.
  const openModal = document.querySelector(".modal");
  const modalScrollTop = openModal ? openModal.scrollTop : null;
  // .words-log (the Recap word list) is a second, independently-scrollable
  // region nested inside .modal — restoring the outer modal's scrollTop
  // above doesn't cover it, so tapping a word to expand its definition
  // (which re-renders everything) would otherwise snap the list itself
  // back to the top even though the modal never moved.
  const openWordsLog = document.querySelector(".words-log");
  const wordsLogScrollTop = openWordsLog ? openWordsLog.scrollTop : null;

  let result;
  if(state.screen === "home") result = renderHome();
  else if(state.screen === "onlineSetup") result = renderOnlineSetup();
  else if(state.screen === "lobby") result = renderLobby();
  else if(state.screen === "setup") result = renderSetup();
  else if(state.screen === "gate") result = renderGate();
  else if(state.screen === "play") result = renderPlay();
  else if(state.screen === "onlinePlay") result = renderOnlinePlay();
  else if(state.screen === "roundEnd") result = renderRoundEnd();
  else if(state.screen === "gameOver") result = renderGameOver();
  else if(state.screen === "dailyResult") result = renderDailyResult();

  if(modalScrollTop !== null){
    const newModal = document.querySelector(".modal");
    if(newModal) newModal.scrollTop = modalScrollTop;
  }
  if(wordsLogScrollTop !== null){
    const newWordsLog = document.querySelector(".words-log");
    if(newWordsLog) newWordsLog.scrollTop = wordsLogScrollTop;
  }
  return result;
}

        // Only actually play if it's still this same CPU's turn.
        // (playAITurn's "no word found" paths call showToast(), which
        // renders synchronously *before* advanceTurn() runs — that
        // extra render() call used to sneak in a second schedule here.
        // The state._aiTurnPlayer check above stops that: while playAITurn()
        // is still running for a player, state._aiTurnPlayer equals
        // state.currentPlayer, so those intermediate renders are skipped.
        // Once advanceTurn() moves to a new player, the mismatch lets the
        // real next turn get scheduled. Without both guards, a stray
        // duplicate timer for the old player could consume this "not yet
        // scheduled" slot and leave the next CPU's turn never scheduled.)
        if(state.screen === "gate" && state.currentPlayer === scheduledPlayer){
          playAITurn();
        }
      }, 650);
    }
    return;
  }
  app.innerHTML = `
    <div class="screen">
      <div class="wrap gate">
        ${miniLogo()}
        <h2>Pass the device to</h2>
        <h1 class="gate-name" style="color:${playerColor(p)};">${escapeHtml(p.name)}</h1>
        ${state.lastPlay ? `
          <div class="last-play-block">
            <div class="last-play-label">${escapeHtml(state.lastPlay.by)} played</div>
            <div class="last-play-row">
              ${state.lastPlay.tiles.map(t => `<div class="btile ${t.wild ? 'wild-tile' : ''} ${t.core ? 'core-tile' : ''}">${escapeHtml(t.letter)}</div>`).join("")}
            </div>
          </div>
        ` : ""}
        <p>Make sure no one else is looking at the screen.</p>
        <button class="btn btn-gold" id="revealBtn">I'm ${escapeHtml(p.name)} — Show My Hand</button>
        <div class="rules-toggle">${settingsTrigger()}&nbsp;·&nbsp;${feedbackTrigger()}</div>
      </div>
    </div>
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ""}
    ${state.showSettings ? renderSettingsModal() : ""}
    ${state.showFeedback ? renderFeedbackModal() : ""}
  `;
  document.getElementById("revealBtn").onclick = ()=>{ state.screen="play"; triggerCorePulse(); if(state.clockMode) startClock(); render(); };
  wireSettingsTrigger();
  wireFeedbackTrigger();
}

/* Online equivalent of renderPlay(): every phone always renders itself, but
   only shows the interactive builder/hand/action-bar when it's actually this
   phone's turn. Otherwise it shows a read-only board plus your own hand (so
   you can plan ahead) while you wait. Other players' hands are never shown —
   only their card/wildcard counts. */
function renderOnlinePlay(){
  const turnPlayer = currentPlayer();
  const isMyTurn = state.online.mySeat === state.currentPlayer;
  const me = state.players[state.online.mySeat];

  if(isMyTurn && !wasMyOnlineTurn){
    notifyMyTurn();
    triggerCorePulse();
    if(state.clockMode) startClock();
  } else if(!isMyTurn){
    stopTitleFlash();
    stopClock();
  }
  wasMyOnlineTurn = isMyTurn;

  // Host-only: schedule the CPU's move if it's a computer's turn. Reuses the
  // same state._aiScheduled / state._aiTurnPlayer guard as local pass-and-play
  // mode (see the comment inside renderGate()) so a duplicate schedule from
  // playAITurn's intermediate showToast() render can't starve the next
  // player's turn.
  if(state.online.isHost && turnPlayer.isCPU){
    if(!state._aiScheduled && state._aiTurnPlayer !== state.currentPlayer){
      state._aiScheduled = true;
      const scheduledPlayer = state.currentPlayer;
      setTimeout(()=>{
        state._aiScheduled = false;
        if(state.mode === "online" && state.currentPlayer === scheduledPlayer){
          playAITurn();
        }
      }, 650);
    }
  }

  const coreClass = "core-card" + (state.core.kind!=="letter" ? " wild-core" : "") + (state.coreShake ? " core-shake" : "") + (state.corePulse ? " pulse" : "");

    .map((pl,i)=>({pl,i}))

    const builderHtml = state.builder.length===0
      ? `<div class="builder-row empty"></div>`

          return `<div class="btile ${c.kind!=='letter'?'wild-tile':''} ${idx===state.coreInsertedAt?'core-tile':''}" data-builder-idx="${idx}">${displayLetter(c)}</div>`;
        }).join("")}</div>`;

      const disabled = cardInBuilder(c);

    const dictHint = (currentLen >= 3 && state.coreInsertedAt !== -1)
      ? (isValidWord(wordString())
          ? `<span style="color:var(--sage);">✓ In dictionary</span>`

    const wordStatus = [dictHint, bonusHint].filter(Boolean).join(state.bigText ? '<br>' : ' &nbsp;·&nbsp; ');

    mainZone = `
      <div class="builder-zone">
        <div class="row-header">

          <button class="btn btn-outline btn-small" id="shuffleBtn" style="flex:1;" ${me.hand.length<2?'disabled':''}>Shuffle</button>
          <button class="btn btn-outline btn-small" id="undoBtn" style="flex:1;" ${state.builder.length===0?'disabled':''}>Undo</button>
          <button class="btn btn-gold btn-small" id="submitBtn" style="flex:1;" ${submitDisabled?'disabled':''}>Play</button>
        </div>
      </div>
      <div class="hand-zone">
        <h2>Hand &amp; Wildcards (${me.wildcards.length}/2)</h2>
        <div class="hand-row">${handHtml}</div>
      </div>
    `;
  } else {
    const allHandCards = [...me.hand, ...me.wildcards];
    const handHtml = allHandCards.map(c=>`<div class="htile ${c.kind!=='letter'?'wild':''}">${c.kind==='letter'?c.letter:'✨'}</div>`).join("");
    mainZone = `
      <div class="gate" style="padding:24px 10px;">
        <div class="thread-icon${turnPlayer.isCPU ? "" : " waiting-pulse"}">${turnPlayer.isCPU ? "🤖" : "⏳"}</div>
        <h2 class="waiting-label" style="color:${playerColor(turnPlayer)};">${escapeHtml(turnPlayer.name)}${turnPlayer.isCPU ? " is thinking" : " is playing"}<span class="waiting-dots"><span>.</span><span>.</span><span>.</span></span></h2>
      </div>
      <div class="hand-zone">
        <h2>Your Hand &amp; Wildcards (${me.wildcards.length}/2)</h2>

            <div class="last-play-row">
              ${state.lastPlay.tiles.map(t => `<div class="btile ${t.wild ? 'wild-tile' : ''} ${t.core ? 'core-tile' : ''}">${escapeHtml(t.letter)}</div>`).join("")}
            </div>
          </div>

        <div class="core-zone">
          <div class="${coreClass}" id="coreCardEl" role="button">${coreSparkles}${displayLetter(state.core)}</div>
        </div>

        ${mainZone}

        ${cardsAndScoreboardTriggers()}

        <div class="rules-toggle">
          <button id="rulesBtn">How to Play At Last</button>
          &nbsp;·&nbsp;

          ${feedbackTrigger()}
          &nbsp;·&nbsp;
          <button id="leaveGameBtn">Leave Game</button>
        </div>
      </div>
    </div>
    ${state.pendingWildAssign ? renderWildPicker() : ""}
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ""}
    ${state.showRules ? renderRulesModal() : ""}
    ${state.showSettings ? renderSettingsModal() : ""}
    ${state.showFeedback ? renderFeedbackModal() : ""}
    ${state.uiCardsOpen ? renderCardsModal(opponents) : ""}

  document.getElementById("leaveGameBtn").onclick = confirmLeaveOnlineRoom;

  }

  if(isMyTurn){
    document.querySelectorAll("[data-card]").forEach(el=>{
      el.onclick = ()=>{
        const id = parseInt(el.dataset.card);
        const allHandCards = [...me.hand, ...me.wildcards];
        const card = allHandCards.find(c=>c.id===id);
        if(!card || cardInBuilder(card)) return;
        addHandCardToBuilder(card);
      };
    });
    document.querySelectorAll("[data-builder-idx]").forEach(el=>{
      el.onclick = ()=>{ removeBuilderIndex(parseInt(el.dataset.builderIdx)); };
    });
    document.getElementById("undoBtn").onclick = removeLastFromBuilder;
    document.getElementById("shuffleBtn").onclick = shuffleHand;
    document.getElementById("submitBtn").onclick = attemptSubmit;
    document.getElementById("drawBtn").onclick = drawCard;
    document.getElementById("coreCardEl").onclick = insertCoreIntoBuilder;
  }
}

function renderWildPicker(){

    <div class="modal-backdrop">

          <button class="wildback-btn" data-wildback>Back</button>
        </div>
      </div>
    </div>
  `;
}

function winnerSparkleField(){
  const emoji = ["✨","🌟","⭐","💫","🎉"];
  let spans = "";
  for(let i=0;i<26;i++){
    const left = Math.random()*100;
    const delay = (Math.random()*0.6).toFixed(2);
    const duration = (2.2 + Math.random()*1.4).toFixed(2);
    const size = 16 + Math.round(Math.random()*14);
    const glyph = emoji[i % emoji.length];
    spans += `<span class="winner-sparkle" style="left:${left}%;font-size:${size}px;animation-delay:${delay}s;animation-duration:${duration}s;">${glyph}</span>`;
  }
  return `<div class="winner-sparkles">${spans}</div>`;
}

function finalWordBlock(){
  if(!state.lastPlay || !state.lastPlay.tiles || !state.lastPlay.tiles.length) return "";
  const tiles = state.lastPlay.tiles.map(t => `<div class="btile ${t.wild ? 'wild-tile' : ''} ${t.core ? 'core-tile' : ''}">${escapeHtml(t.letter)}</div>`).join("");
  return `
    <div class="last-play-block">
      <div class="last-play-label">Final word:</div>
      <div class="last-play-row">${tiles}</div>
    </div>
  `;
}

        <h1>${escapeHtml(lr.winner)} wins the round!</h1>

      dealRound();

      // Mirrors advanceTurn()'s screen logic: Daily Challenge is always one
      // human + the CPU on a single device, so there's never a real "pass
      // the device" handoff needed when the human starts the next round —
      // skip straight to play. The CPU still gets its normal "thinking"
      // gate screen when it's the one starting.
      if(isOnline){
        state.screen = "onlinePlay";
      } else if(state.mode === "daily" && !currentPlayer().isCPU){
        state.screen = "play";

        state.screen = "gate";
      }
      syncOnline();
      render();

function renderDailyResult(){
  const you = state.players ? state.players[0] : null;
  const cpu = state.players ? state.players[1] : null;
  const stored = (you && cpu) ? null : getStoredDailyResult(); // returning visitor after a fresh page load
  const myName = you ? you.name : (stored && stored.name ? stored.name : "You");
  const humanScore = you ? you.score : (stored ? stored.humanScore : 0);
  const cpuScore = cpu ? cpu.score : (stored ? stored.cpuScore : 0);
  const netScore = humanScore - cpuScore;
  const netLabel = netScore > 0 ? ("+" + netScore) : String(netScore);
  const netColor = netScore > 0 ? "var(--sage)" : (netScore < 0 ? "var(--brick)" : "var(--text-muted)");
  const dateForFetch = state.dailyDate || (stored && stored.date) || todayDateString();

  if(you && cpu && !state._dailyResultSubmitted){
    state._dailyResultSubmitted = true;
    submitAndFetchDailyPercentile();
  } else if(stored && !state._dailyResultSubmitted){
    state._dailyResultSubmitted = true;
    fetchDailyPercentileOnly(stored.date, stored.netScore).then(()=>{
      updateDailyStatsPercentile(stored.date, state.dailyPercentile);
      render();
    });
  }

  const errorMessages = {
    not_configured: "Today's Scores isn't set up yet — see the Firebase setup comment near the top of the file's &lt;script&gt;.",
    write_failed: "Couldn't save your score for today. This usually means the <code>daily_results</code> collection needs a Firestore security rule allowing writes.",
    read_failed: "Your score saved, but today's scores couldn't be loaded. This usually means the <code>daily_results</code> collection needs a Firestore security rule allowing reads.",
  };
  const percentileBlock = state.dailyFetchError
    ? `<p style="color:var(--brick);font-weight:700;font-size:calc(13px * var(--text-scale));line-height:1.5;">${errorMessages[state.dailyFetchError] || "Couldn't load today's scores."}</p>`

      ? `<p style="color:var(--text-muted);font-weight:600;">Comparing you to today's other players…</p>`

  const scoresBlock = (state.dailyHighest == null || state.dailyLowest == null) ? "" : `
    <div class="panel" style="text-align:left;margin-top:14px;">
      <h2>Today's Scores</h2>
      ${[
        { label: "Highest", value: state.dailyHighest, mine: false },
        { label: "Your score", value: netScore, mine: true },
        { label: "Lowest", value: state.dailyLowest, mine: false },
      ]
      .sort((a, b) => b.value - a.value)
      .map(row => `
        <div class="scoreboard-row"${row.mine ? ' style="color:var(--violet);"' : ''}>
          <span>${escapeHtml(row.label)}</span>
          <span class="pts mono">${row.value > 0 ? "+" : ""}${row.value}</span>
        </div>
      `).join("")}
    </div>
  `;
  const refreshBlock = state.dailyFetchError && state.dailyFetchError === "not_configured" ? "" : `
    <div style="text-align:center;margin-top:10px;">
      <button class="status-chip" id="dailyRefreshBtn" style="width:auto;display:inline-flex;" ${state.dailyRefreshing ? "disabled" : ""}>
        ${state.dailyRefreshing ? "Refreshing…" : "Refresh Scores"}
      </button>
    </div>
  `;

  app.innerHTML = `
    ${winnerSparkleField()}
    <div class="screen">
      <div class="wrap winscreen">
        ${miniLogo()}
        <h1>Today's Daily Challenge</h1>
        <p style="color:var(--text-muted);font-weight:600;margin-bottom:18px;">${escapeHtml(state.dailyDate || todayDateString())}</p>
        ${finalWordBlock()}
        <div class="history-trigger-row" style="display:flex;gap:10px;justify-content:center;">
          <button class="status-chip" id="historyBtn" style="width:auto;display:inline-flex;justify-content:center;text-align:center;">Recap</button>
          <button class="status-chip" id="dailyStatsBtn" style="width:auto;display:inline-flex;justify-content:center;text-align:center;">My Stats</button>
        </div>
        <div class="panel" style="text-align:left;margin-top:8px;">
          <h2>Result</h2>
          <div class="scoreboard-row"><span>${escapeHtml(myName)}</span><span class="pts mono">${humanScore}</span></div>
          <div class="scoreboard-row"><span>Computer</span><span class="pts mono">${cpuScore}</span></div>
          <div class="scoreboard-row" style="border-bottom:none;"><span><strong>Net score</strong></span><span class="pts mono" style="color:${netColor};font-weight:800;">${netLabel}</span></div>
        </div>
        <button class="btn btn-gold" id="dailyShareBtn" style="margin-top:12px;">Share Your Score</button>
        <div style="margin:16px 0;">${percentileBlock}</div>
        ${scoresBlock}
        ${refreshBlock}
        <p style="color:var(--text-muted);font-size:calc(13px * var(--text-scale));font-weight:600;margin:16px 0;">Come back tomorrow for a new puzzle.</p>
        <button class="btn btn-outline" id="dailyHomeBtn">Back to Home</button>
        <div class="rules-toggle">${settingsTrigger()}&nbsp;·&nbsp;${feedbackTrigger()}</div>
      </div>
    </div>
    ${state.showSettings ? renderSettingsModal() : ""}
    ${state.showFeedback ? renderFeedbackModal() : ""}
    ${state.uiWordsOpen ? renderWordsModal() : ""}
    ${state.showDailyStats ? renderDailyStatsModal() : ""}
  `;
  wireSettingsTrigger();
  wireFeedbackTrigger();
  wireHistoryTrigger();
  wireDailyStatsTrigger();
  document.getElementById("dailyShareBtn").onclick = ()=>{ shareDailyResult(netScore); };
  const refreshBtn = document.getElementById("dailyRefreshBtn");
  if(refreshBtn){
    refreshBtn.onclick = async ()=>{
      state.dailyRefreshing = true;
      render();
      await fetchDailyPercentileOnly(dateForFetch, netScore);
      state.dailyRefreshing = false;
      render();
    };
  }
  document.getElementById("dailyHomeBtn").onclick = ()=>{
    state._dailyResultSubmitted = false;
    state.showDailyStats = false;
    state.screen = "home";
    render();
  };
}

function renderGameOver(){
  const isOnline = state.mode === "online";
  const canAdvance = !isOnline || state.online.isHost;
  app.innerHTML = `
    ${winnerSparkleField()}
    <div class="screen">
      <div class="wrap winscreen">
        ${miniLogo()}
        <div class="thread-icon">🏆</div>
        <h1>${escapeHtml(state.gameWinner)} wins the game!</h1>
        ${finalWordBlock()}
        ${historyTrigger()}
        <p style="color:var(--text-muted);margin-bottom:20px;font-weight:600;">First to reach ${currentWinningScore()} points.</p>
        <div class="panel" style="text-align:left;">
          <h2>Final Scores</h2>
          ${scoreboardRows()}
        </div>
        ${canAdvance
          ? `<button class="btn btn-gold" id="againBtn" style="margin-top:16px;">New Game</button>`
          : `<p style="text-align:center;color:var(--text-muted);font-weight:700;margin-top:16px;">Waiting for the host to start a new game…</p>`}
        <div class="rules-toggle">
          ${settingsTrigger()}
          &nbsp;·&nbsp;
          ${feedbackTrigger()}
          ${isOnline ? `&nbsp;·&nbsp;<button id="leaveBtn2">Leave Room</button>` : ""}
        </div>
      </div>
    </div>
    ${state.showSettings ? renderSettingsModal() : ""}
    ${state.showFeedback ? renderFeedbackModal() : ""}
    ${state.uiWordsOpen ? renderWordsModal() : ""}
  `;
  wireSettingsTrigger();
  wireFeedbackTrigger();
  wireHistoryTrigger();
  if(canAdvance){
    document.getElementById("againBtn").onclick = ()=>{
      if(isOnline){
        state.players.forEach(pl=>{ pl.score = 0; pl.timeLeft = 120; pl.eliminated = false; });
        state.gameWinner = null;
        state.wordLog = [];
        state.openWordDefs.clear();
        state.roundNum = 0;
        newAnalyticsSession();
        logEvent("game_started", {
          playerCount: state.players.length,
          cpuCount: state.players.filter(pl=>pl.isCPU).length,
          clockMode: !!state.clockMode,
        });
        dealRound();
        state.currentPlayer = 0;
        state.nextStarter = 0; // round 1 of a fresh game always starts at seat 0
        state.screen = "onlinePlay";
        syncOnline();
        render();
      } else {
        state = { ...state, screen:"setup", builder:[], lastRound:null, gameWinner:null, wordLog:[] };
        render();
      }
    };
  }
  if(isOnline){
    document.getElementById("leaveBtn2").onclick = leaveOnlineRoom;
  }
}

/* delegate for dynamically-inserted modal buttons since they're re-rendered inside renderPlay's innerHTML string */
document.addEventListener("click", (e)=>{
  if(e.target.dataset && e.target.dataset.letter){
    assignWildLetter(e.target.dataset.letter);
  }
  if(e.target.dataset && e.target.dataset.wildback !== undefined){
    cancelWildAssign();
  }
});

/* Stop flashing the title the moment the player actually looks at the tab,
   even if they haven't submitted a word yet. */
window.addEventListener("focus", stopTitleFlash);
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden) stopTitleFlash();
});

function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

const inviteCode = getRoomCodeFromURL();
if(inviteCode){
  state.mode = "online";
  state.screen = "onlineSetup";
  state.online.joinCodeInput = inviteCode;
  state.online.fromInvite = true;
}
loadTheme();
tryResumeSession();
render();
</script>
</body>
</html>
