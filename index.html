<style>
  :root{
    --ink:#4A3B63;
    --panel:rgba(255,255,255,.82);
    --panel-2:rgba(255,255,255,.6);
    --tile:#FFFFFF;
    --tile-ink:#4A3B63;
    --pink:#FF6FB5;
    --orange:#FFB259;
    --yellow:#FFDD5C;
    --mint:#5FE0B7;
    --sky:#5EC4F0;
    --violet:#A78BFA;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet); /* legacy var still referenced in places */
    --teal:var(--sky);
    --brick:#E8577A;
    --sage:#3FAE85;
    --text:#4A3B63;
    --text-muted:#6E6191;
    --line:#E7DFF7;
    --border:#E7DFF7;
    --text-scale:1;
  }
  *{box-sizing:border-box; touch-action:manipulation;}
  body{
    margin:0;
    touch-action:manipulation;
    background:
      radial-gradient(circle at 15% 10%, #FFE3F3 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #E1F3FF 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #E9FFF3 0%, transparent 50%),
      linear-gradient(160deg,#FCEFFF 0%,#EFEBFF 35%,#E9F6FF 70%,#EFFFF6 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{ font-family:'Baloo 2',cursive; font-weight:700; margin:0; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ---------- layout shells ---------- */
  .screen{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 100px; }
  .screen.play-screen{ padding:12px 14px 90px; min-height:auto; }
  .wrap{ width:100%; max-width:640px; }

  /* ---------- title ---------- */
  .title-block{ text-align:center; margin:24px 0 32px; }
  .title-block h1{ font-size:calc(48px * var(--text-scale)); line-height:1.05; letter-spacing:-.01em; color:var(--ink); }
  .title-block h1 .thread{
    background:var(--rainbow); -webkit-background-clip:text; background-clip:text; color:transparent;
    font-style:normal; font-weight:800;
  }
  .title-block p{ color:var(--text-muted); margin-top:10px; font-size:calc(15px * var(--text-scale)); font-weight:600; }

  .mini-logo{ text-align:center; font-size:calc(22px * var(--text-scale)); font-weight:800; letter-spacing:-.01em; color:var(--ink); margin-bottom:16px; }
  .mini-logo .thread{
    background:var(--rainbow); -webkit-background-clip:text; background-clip:text; color:transparent;
    font-style:normal; font-weight:800;
  }

  /* ---------- cards / panels ---------- */
  .panel{
    background:var(--panel); border:1px solid rgba(255,255,255,.9); border-radius:22px;
    padding:22px; margin-bottom:16px; backdrop-filter:blur(6px);
    box-shadow:0 8px 30px -12px rgba(122,90,190,.25);
  }
  .panel h2{ font-size:calc(15px * var(--text-scale)); text-transform:uppercase; letter-spacing:.06em; color:var(--violet); margin-bottom:14px; font-family:'Baloo 2',cursive; font-weight:700;}

  /* ---------- buttons ---------- */
  button{ font-family:'Nunito',sans-serif; cursor:pointer; border:none; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 20px; border-radius:999px; font-weight:800; font-size:calc(15px * var(--text-scale));
    transition:transform .08s ease, opacity .15s ease, box-shadow .15s ease; width:100%;
  }
  .btn:active{ transform:scale(.97); }
  .btn-gold{ background:var(--rainbow); color:#3B2A57; box-shadow:0 8px 20px -8px rgba(167,139,250,.6); }
  .btn-gold:hover{ box-shadow:0 10px 26px -8px rgba(167,139,250,.8); }
  .btn-outline{ background:#FFFFFFCC; color:var(--ink); border:2px solid var(--violet); }
  .btn-outline:hover{ background:#FFFFFF; }
  .btn-sage{ background:var(--sage); color:#fff; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; }
  .btn-small{ padding:9px 14px; font-size:calc(13px * var(--text-scale)); border-radius:999px; width:auto; }

  /* ---------- setup screen ---------- */
  .stepper{ display:flex; align-items:center; justify-content:center; gap:18px; margin:8px 0 6px; }
  .stepper button{
    width:calc(46px * var(--text-scale)); height:calc(46px * var(--text-scale)); border-radius:50%; background:#FFFFFFD0;
    color:var(--violet); font-size:calc(22px * var(--text-scale)); border:2px solid var(--border); font-weight:800;
  }
  .stepper .count{ font-family:'Baloo 2',cursive; font-size:calc(40px * var(--text-scale)); min-width:calc(54px * var(--text-scale)); text-align:center; color:var(--ink); }
  .name-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .name-row .dot{ width:10px; height:10px; border-radius:50%; background:var(--rainbow); flex-shrink:0; }
  .name-row input{
    flex:1; min-width:0; background:#FFFFFFCC; border:2px solid var(--border); border-radius:12px;
    padding:10px 12px; color:var(--text); font-size:max(16px, calc(14px * var(--text-scale))); font-family:'Nunito',sans-serif; font-weight:600;
  }
  .name-row input:focus{ outline:none; border-color:var(--violet); }

  .feedback-textarea{
    width:100%; min-height:110px; resize:vertical; display:block;
    background:#FFFFFFCC; border:2px solid var(--border); border-radius:12px;
    padding:10px 12px; color:var(--text); font-size:max(16px, calc(14px * var(--text-scale)));
    font-family:'Nunito',sans-serif; font-weight:600; line-height:1.4;
  }
  .feedback-textarea:focus{ outline:none; border-color:var(--violet); }

  /* ---------- pass-device gate ---------- */
  .gate{ text-align:center; padding:60px 20px; }
  .gate .thread-icon{ font-size:calc(52px * var(--text-scale)); margin-bottom:18px; }
  .gate .thread-icon.waiting-pulse{ animation:waitingPulse 1.8s ease-in-out infinite; }
  @keyframes waitingPulse{
    0%,100%{ transform:scale(1); opacity:.85; }
    50%{ transform:scale(1.12); opacity:1; }
  }
  .waiting-label{ opacity:.9; animation:waitingFade 1.8s ease-in-out infinite; }
  @keyframes waitingFade{
    0%,100%{ opacity:.75; }
    50%{ opacity:1; }
  }
  .waiting-dots span{ display:inline-block; animation:waitingDot 1.4s infinite; opacity:.2; }
  .waiting-dots span:nth-child(1){ animation-delay:0s; }
  .waiting-dots span:nth-child(2){ animation-delay:.2s; }
  .waiting-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes waitingDot{
    0%,60%,100%{ opacity:.2; }
    30%{ opacity:1; }
  }
  .gate h2{ font-size:calc(24px * var(--text-scale)); margin-bottom:8px; color:var(--text-muted); text-transform:none; letter-spacing:0; font-family:'Nunito',sans-serif; font-weight:700; }
  .gate p{ color:var(--text-muted); font-size:calc(14px * var(--text-scale)); margin-bottom:26px; font-weight:600; }
  .gate-name{ font-size:calc(34px * var(--text-scale)); margin-bottom:18px; }
  .last-play-block{ margin:0 0 26px; }
  .last-play-label{ font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .last-play-row{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }

  /* ---------- game board ---------- */
  .board-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .board-top .who{ font-family:'Baloo 2',cursive; font-size:calc(20px * var(--text-scale)); color:var(--ink); }
  .clock-badge{
    font-family:'IBM Plex Mono',monospace; font-weight:800; font-size:calc(13px * var(--text-scale));
    padding:6px 12px; border-radius:999px; background:#FFFFFFCC; border:2px solid var(--border); color:var(--ink);
    flex-shrink:0;
  }
  .clock-badge.low{ background:var(--brick); border-color:var(--brick); color:#fff; }
  .board-top .deck-count{ font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); text-align:right; line-height:1.4;}
  .deck-count-line{ font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); text-align:center; margin-top:2px; margin-bottom:10px; letter-spacing:.02em; }
  .score-strip{ font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); text-align:center; margin-bottom:10px; letter-spacing:.02em; }
  .cpu-toggle{ display:flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-weight:700; white-space:nowrap; flex-shrink:0; }
  .cpu-toggle input{ width:15px; height:15px; accent-color:var(--violet); flex-shrink:0; }
  .diff-row{ display:flex; gap:6px; margin:6px 0 10px 20px; }
  .diff-chip{
    flex:1; padding:6px 4px; border-radius:999px; border:2px solid var(--border);
    background:#FFFFFFCC; color:var(--text-muted); font-weight:700;
    font-size:calc(11px * var(--text-scale)); font-family:'IBM Plex Mono',monospace;
  }
  .diff-chip.active{ border-color:var(--violet); color:var(--violet); background:#FFFFFF; }
  body.dark-mode .diff-chip{ background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-muted); }
  body.dark-mode .diff-chip.active{ border-color:var(--violet); color:var(--violet); background:rgba(255,255,255,.09); }
  .score-strip b{ color:var(--violet); }
  .scoreboard-row{ display:flex; justify-content:space-between; padding:7px 0; font-weight:700; font-size:calc(15px * var(--text-scale)); border-bottom:1px solid var(--line); }
  .cards-row{ padding:9px 0; border-bottom:1px solid var(--line); }
  .cards-row-name{ font-weight:700; font-size:calc(15px * var(--text-scale)); }
  .cards-row-stats{ font-size:calc(13px * var(--text-scale)); color:var(--text-muted); font-weight:600; margin-top:3px; }
  .word-term{
    background:none; border:none; padding:0; margin:0; font-family:inherit; cursor:pointer;
    text-decoration:underline; text-decoration-style:dotted; text-decoration-color:var(--text-muted);
    text-underline-offset:3px; text-align:left; color:inherit;
  }
  .word-term:active{ opacity:.7; }
  .word-def{
    margin-top:6px; font-size:calc(12.5px * var(--text-scale)); color:var(--text-muted);
    font-weight:600; line-height:1.5; background:var(--panel-2); border-radius:8px; padding:8px 10px;
  }
  .word-def-muted{ font-style:italic; }
  .words-log{ max-height:260px; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px; }
  .words-log .cards-row:last-child{ border-bottom:none; }
  .words-log-top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .words-log-points{ flex-shrink:0; color:var(--violet); font-size:calc(13px * var(--text-scale)); font-weight:700; }
  .history-trigger-row{ text-align:center; margin:4px 0 18px; }
  .history-trigger-row .status-chip{ width:auto; display:inline-flex; padding:9px 20px; }
  .stat-mini-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:14px; }
  .stat-mini{ text-align:center; background:#FFFFFFCC; border:2px solid var(--border); border-radius:12px; padding:12px 6px; }
  .stat-mini .num{ font-family:'Baloo 2',cursive; font-size:calc(24px * var(--text-scale)); color:var(--violet); line-height:1.1; }
  .stat-mini .lbl{ font-family:'IBM Plex Mono',monospace; font-size:calc(10px * var(--text-scale)); text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-top:4px; }
  .scoreboard-row:last-child{ border-bottom:none; }
  .scoreboard-row .pts{ font-family:'IBM Plex Mono',monospace; color:var(--violet); }

  .core-zone{ display:flex; flex-direction:column; align-items:center; padding:8px 0 4px; }
  .core-card{
    width:calc(62px * var(--text-scale)); height:calc(80px * var(--text-scale)); border-radius:14px; background:var(--tile); color:var(--tile-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
    font-size:calc(34px * var(--text-scale)); font-weight:700; position:relative; transition:transform .15s ease;
    box-shadow:0 0 0 4px transparent, 0 10px 22px -10px rgba(122,90,190,.45);
    background-image:linear-gradient(#fff,#fff), var(--rainbow);
    background-origin:border-box; background-clip:padding-box, border-box;
    border:3px solid transparent; cursor:pointer;
  }
  .core-card:active{ transform:scale(.94); }
  .core-card.wild-core{ background-image:linear-gradient(155deg,#fff 0%, #FFF5FC 100%), var(--rainbow); color:var(--violet); }
  .core-card.pulse{ animation:corepulse .5s ease !important; }
  @keyframes corepulse{ 0%{transform:scale(.7) rotate(-4deg); opacity:0;} 60%{transform:scale(1.08) rotate(2deg);} 100%{transform:scale(1) rotate(0);} }
  .core-card.core-shake{ animation:shakeword .5s ease !important; box-shadow:0 0 0 4px var(--brick), 0 10px 22px -10px rgba(122,90,190,.45); border-color:var(--brick); }
  .core-sparkle{
    position:absolute; pointer-events:none; font-size:16px; animation:sparklefloat .55s ease-out forwards;
  }

  @keyframes shakeword{
    0%,100%{ transform:translateX(0); }
    15%{ transform:translateX(calc(-10px * var(--text-scale))) rotate(-2deg); }
    30%{ transform:translateX(calc(9px * var(--text-scale))) rotate(2deg); }
    45%{ transform:translateX(calc(-7px * var(--text-scale))) rotate(-1.5deg); }
    60%{ transform:translateX(calc(6px * var(--text-scale))) rotate(1deg); }
    75%{ transform:translateX(calc(-4px * var(--text-scale))); }
    90%{ transform:translateX(calc(2px * var(--text-scale))); }
  }
  .builder-row.shake{ animation:shakeword .5s ease; border-color:var(--brick); }
  .builder-row.shake .btile{ box-shadow:0 0 0 2px var(--brick); }

  @keyframes successpop{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.12) rotate(-1deg); }
    55%{ transform:scale(0.97) rotate(1deg); }
    100%{ transform:scale(1) rotate(0); }
  }
  .builder-row.success{ animation:successpop .55s cubic-bezier(.34,1.56,.64,1); border-color:var(--mint); border-style:solid; }
  .builder-row.success .btile{
    animation:successpop .55s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 0 0 2px var(--sage), 0 4px 14px -4px rgba(95,224,183,.7);
  }
  .success-sparkle{
    position:absolute; pointer-events:none; font-size:16px; animation:sparklefloat .55s ease-out forwards;
  }
  @keyframes sparklefloat{
    0%{ opacity:1; transform:translateY(0) scale(0.6); }
    100%{ opacity:0; transform:translateY(-24px) scale(1.2); }
  }

  /* Extra-special celebration for playing a full 8-letter word — the
     ordinary .success treatment still applies underneath, this just adds
     a bigger glow pulse plus a ring of emoji exploding outward from the
     center of the word box. */
  @keyframes epicGlow{
    0%{ box-shadow:0 0 0 2px var(--mint); }
    20%{ box-shadow:0 0 0 3px var(--pink), 0 0 26px 4px rgba(255,111,181,.55); }
    40%{ box-shadow:0 0 0 3px var(--orange), 0 0 26px 4px rgba(255,178,89,.55); }
    60%{ box-shadow:0 0 0 3px var(--sky), 0 0 26px 4px rgba(94,196,240,.55); }
    80%{ box-shadow:0 0 0 3px var(--violet), 0 0 26px 4px rgba(167,139,250,.55); }
    100%{ box-shadow:0 0 0 2px var(--mint), 0 4px 14px -4px rgba(95,224,183,.7); }
  }
  .builder-row.epic{ animation:successpop .55s cubic-bezier(.34,1.56,.64,1), epicGlow 1.1s ease-out; }
  @keyframes epicExplode{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(0.5) rotate(0deg); }
    15%{ opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(calc(var(--er) * 0.15)); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--ex)), calc(-50% + var(--ey))) scale(0.9) rotate(var(--er)); }
  }
  .epic-sparkle{
    position:absolute; left:50%; top:50%; pointer-events:none; font-size:24px;
    animation:epicExplode 1s cubic-bezier(.19,.79,.34,1) forwards; z-index:2;
  }

  .core-thread{ width:44px; height:4px; border-radius:6px; background:var(--rainbow); opacity:.75; margin-top:3px; }

  /* builder */
  .row-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:8px; }
  .row-header h2{ font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em; margin:0; }
  .word-status{ font-size:calc(11px * var(--text-scale)); font-weight:700; font-family:'IBM Plex Mono',monospace; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn-tiny{ padding:5px 10px !important; font-size:calc(11px * var(--text-scale)) !important; border-radius:999px; width:auto !important; }
  .builder-zone{ margin:6px 0 4px; }
  .builder-row{
    min-height:72px; border-radius:14px; border:2px dashed var(--border);
    display:flex; align-items:center; gap:6px; padding:8px; flex-wrap:wrap;
    background:var(--panel-2); position:relative;
  }
  .builder-row.empty::before{ content:"Tap letters below or the Core Card, to build your word"; color:var(--text-muted); font-size:calc(12px * var(--text-scale)); font-family:'Nunito',sans-serif; font-weight:600;}
  .btile{
    border-radius:10px; background:var(--tile); color:var(--tile-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
    font-weight:700; position:relative; flex-shrink:0; border:3px solid var(--border);
  }
  .builder-row .btile, .last-play-row .btile{
    width:calc((100% - 42px)/8 * var(--text-scale)); max-width:calc(44px * var(--text-scale)); aspect-ratio:44/52;
    font-size:clamp(calc(15px * var(--text-scale)), calc(5.2vw * var(--text-scale)), calc(24px * var(--text-scale)));
  }
  .btile.core-tile{ box-shadow:0 0 0 3px var(--violet); }
  .btile.wild-tile{
    color:var(--violet); border:3px solid transparent;
    background-image:linear-gradient(#fff,#fff), var(--rainbow);
    background-origin:border-box; background-clip:padding-box, border-box;
  }
  .builder-row .btile{ cursor:pointer; }
  .builder-row .btile:active{ transform:scale(.9); opacity:.75; }

  .hand-zone{ margin-top:8px; }
  .hand-zone h2{ font-size:calc(11px * var(--text-scale)); color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .hand-row{ display:flex; gap:6px; flex-wrap:wrap; padding:2px 0 4px; }
  .htile{
    width:calc(44px * var(--text-scale)); height:calc(52px * var(--text-scale)); border-radius:10px; background:var(--tile); color:var(--tile-ink);
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
    font-size:calc(24px * var(--text-scale)); font-weight:700; flex-shrink:0; transition:transform .1s ease, opacity .15s;
    border:3px solid var(--border);
  }
  .htile:active{ transform:translateY(2px); }
  .htile.wild{
    color:var(--violet); border:3px solid transparent;
    background-image:linear-gradient(#fff,#fff), var(--rainbow);
    background-origin:border-box; background-clip:padding-box, border-box;
  }
  .htile.used{ opacity:.25; pointer-events:none; }

  .loadout-row{ display:flex; gap:10px; margin-top:8px; }
  .loadout-chip{
    display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px;
    background:#FFFFFFCC; border:2px solid var(--border); font-size:calc(12px * var(--text-scale)); color:var(--text-muted);
    font-family:'Nunito',sans-serif; font-weight:700;
  }
  .loadout-chip .swatch{ width:14px; height:14px; border-radius:5px; background:var(--rainbow); }
  .loadout-chip.spent{ opacity:.35; text-decoration:line-through; }

  .action-bar{ display:flex; gap:8px; margin-top:10px; }

  .status-toggle-row{ display:flex; gap:8px; margin-top:16px; }
  .status-chip{
    flex:1; background:#FFFFFFCC; color:var(--text-muted); border:2px solid var(--border);
    border-radius:999px; padding:9px 14px; font-size:calc(12px * var(--text-scale)); font-weight:800;
    font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;
  }
  .status-chip:active{ transform:scale(.97); }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#FFFFFFF2; border:2px solid var(--violet); color:var(--ink);
    padding:12px 18px; border-radius:14px; font-size:calc(13px * var(--text-scale)); font-weight:700; max-width:90%; text-align:center;
    box-shadow:0 8px 24px rgba(122,90,190,.35); z-index:50;
  }

  .winscreen{ text-align:center; padding:0 20px 80px; position:relative; }
  .winscreen h1{
    font-size:calc(42px * var(--text-scale)); margin-bottom:10px; background:var(--rainbow); -webkit-background-clip:text;
    background-clip:text; color:transparent;
    animation:winnerTitlePop .6s cubic-bezier(.34,1.56,.64,1);
  }
  .winscreen .thread-icon{ font-size:calc(56px * var(--text-scale)); margin-bottom:20px; animation:winnerIconSpin .7s cubic-bezier(.34,1.56,.64,1); }

  @keyframes winnerTitlePop{
    0%{ transform:scale(.6); opacity:0; }
    60%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  @keyframes winnerIconSpin{
    0%{ transform:scale(.3) rotate(-30deg); opacity:0; }
    60%{ transform:scale(1.15) rotate(8deg); opacity:1; }
    100%{ transform:scale(1) rotate(0); }
  }

  .winner-sparkles{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .winner-sparkle{
    position:absolute; top:-40px; font-size:22px; opacity:0;
    animation-name:winnerSparkleFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes winnerSparkleFall{
    0%{ transform:translateY(0) rotate(0deg) scale(.6); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg) scale(1); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .winner-sparkles{ display:none; } }

  .letterpicker{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:12px; }
  .letterpicker button{
    background:#FFFFFFD0; border:2px solid var(--border); color:var(--ink);
    border-radius:10px; font-family:'Fredoka',sans-serif; font-weight:700; font-size:calc(20px * var(--text-scale));
    aspect-ratio:1/1; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .letterpicker button:hover{ border-color:var(--violet); }
  .letterpicker button.wildback-btn{
    grid-column:span 2; aspect-ratio:auto; background:var(--violet); color:#FFF; border-color:var(--violet);
    font-size:calc(16px * var(--text-scale));
  }
  .letterpicker button.wildback-btn:hover{ background:var(--violet); opacity:.9; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(74,59,99,.45); display:flex; align-items:center;
    justify-content:center; z-index:60; padding:20px;
  }
  .modal{
    background:#FFF; border:1px solid var(--border); border-radius:20px; padding:32px 24px; max-width:380px; width:100%;
    box-shadow:0 20px 50px -15px rgba(74,59,99,.4);
    max-height:calc(100vh - 40px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .modal h3{ font-size:calc(19px * var(--text-scale)); margin-bottom:10px; color:var(--ink); }
  .modal p{ color:var(--text-muted); font-size:calc(14px * var(--text-scale)); margin-bottom:16px; line-height:1.5; font-weight:600; }

  .rules-toggle{ text-align:center; margin-top:6px; }
  .rules-toggle button{ background:none; color:var(--violet); font-size:calc(13px * var(--text-scale)); font-weight:700; text-decoration:underline; font-family:'Nunito',sans-serif; }

  /* ---------- home-screen top links ---------- */
  .mode-toggle-row{
    display:flex; align-items:center; justify-content:center; gap:16px; margin-top:6px; flex-wrap:wrap;
  }
  .mode-toggle-row button{
    background:none; font-size:calc(13px * var(--text-scale)); font-weight:700; text-decoration:underline;
    font-family:'Nunito',sans-serif; color:var(--violet);
  }

  /* ---------- settings modal ---------- */
  .settings-label{
    font-size:calc(11px * var(--text-scale)); text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);
    font-family:'IBM Plex Mono',monospace; font-weight:700; margin-bottom:8px;
  }
  .settings-segment{ display:flex; gap:8px; }
  .settings-toggle-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .segment-btn{
    flex:1; padding:11px 10px; border-radius:12px; border:2px solid var(--border);
    background:#FFFFFFCC; color:var(--text-muted); font-weight:700; font-size:calc(13px * var(--text-scale));
    font-family:'Nunito',sans-serif;
  }
  .segment-btn.active{ border-color:var(--violet); color:var(--violet); background:#FFFFFF; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .settings-row-text{ color:var(--text-muted); font-size:calc(13px * var(--text-scale)); font-weight:600; line-height:1.4; }
  .switch{ position:relative; display:inline-block; width:calc(44px * var(--text-scale)); height:calc(26px * var(--text-scale)); flex-shrink:0; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .slider{
    position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:background .15s ease;
  }
  .switch .slider::before{
    content:""; position:absolute; height:calc(20px * var(--text-scale)); width:calc(20px * var(--text-scale)); left:3px; top:3px; background:#fff;
    border-radius:50%; transition:transform .15s ease; box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .slider{ background:var(--violet); }
  .switch input:checked + .slider::before{ transform:translateX(calc(18px * var(--text-scale))); }

  ::selection{ background:var(--pink); color:#fff; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* =====================================================================
     DARK MODE
     Same layout & components — only colour is repainted for a dim, low-
     glare palette. Letter tiles stay bright white (like physical tiles)
     since that's the single most important thing to read at a glance.
     ===================================================================== */
  body.dark-mode{
    --ink:#F1EAFF;
    --panel:rgba(255,255,255,.06);
    --panel-2:rgba(255,255,255,.045);
    --tile:#FFFFFF;
    --tile-ink:#2A2040;
    --pink:#FF7FC4;
    --orange:#FFB259;
    --yellow:#FFE06B;
    --mint:#5FE0B7;
    --sky:#70D2FF;
    --violet:#BB9EFF;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet);
    --teal:var(--sky);
    --brick:#FF7C93;
    --sage:#57E6AE;
    --text:#EFE9FB;
    --text-muted:#B6A9DA;
    --line:#372B54;
    --border:#3A2E58;
    background:
      radial-gradient(circle at 15% 10%, #2A1F42 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #17233B 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #142A24 0%, transparent 50%),
      linear-gradient(160deg,#120C20 0%,#161029 35%,#0D131F 70%,#0C1613 100%);
    background-attachment:fixed;
  }
  body.dark-mode .panel{
    border-color:rgba(255,255,255,.08);
    box-shadow:0 8px 30px -12px rgba(0,0,0,.55);
  }
  body.dark-mode .btn-outline{ background:rgba(255,255,255,.05); color:var(--text); border-color:var(--violet); }
  body.dark-mode .btn-outline:hover{ background:rgba(255,255,255,.09); }
  body.dark-mode .btn-gold{ color:#241835; }
  body.dark-mode .stepper button{ background:rgba(255,255,255,.07); color:var(--violet); border-color:var(--border); }
  body.dark-mode .stepper .count{ color:var(--ink); }
  body.dark-mode .name-row input{ background:rgba(255,255,255,.06); color:var(--text); border-color:var(--border); }
  body.dark-mode .name-row input::placeholder{ color:var(--text-muted); opacity:.8; }
  body.dark-mode .feedback-textarea{ background:rgba(255,255,255,.06); color:var(--text); border-color:var(--border); }
  body.dark-mode .feedback-textarea::placeholder{ color:var(--text-muted); opacity:.8; }
  body.dark-mode .loadout-chip{ background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-muted); }
  body.dark-mode .status-chip{ background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-muted); }
  body.dark-mode .clock-badge{ background:rgba(255,255,255,.07); border-color:var(--border); color:var(--ink); }
  body.dark-mode .clock-badge.low{ background:var(--brick); border-color:var(--brick); color:#fff; }
  body.dark-mode .toast{ background:#241C38F2; border-color:var(--violet); color:var(--ink); box-shadow:0 8px 24px rgba(0,0,0,.5); }
  body.dark-mode .letterpicker button{ background:rgba(255,255,255,.07); color:var(--ink); border-color:var(--border); }
  body.dark-mode .letterpicker button:hover{ border-color:var(--violet); }
  body.dark-mode .modal-backdrop{ background:rgba(6,4,14,.72); }
  body.dark-mode .modal{ background:#1C1730; border-color:var(--border); box-shadow:0 20px 50px -15px rgba(0,0,0,.65); }
  body.dark-mode .modal h3{ color:var(--ink); }
  body.dark-mode .core-card{ box-shadow:0 0 0 4px transparent, 0 10px 22px -10px rgba(0,0,0,.55); }
  body.dark-mode .core-card.wild-core{ background-image:linear-gradient(155deg,#fff 0%, #FFF5FC 100%), var(--rainbow); }
  body.dark-mode .htile, body.dark-mode .btile{ box-shadow:0 4px 10px -4px rgba(0,0,0,.4); }
  body.dark-mode ::selection{ background:var(--pink); color:#1C1730; }
  body.dark-mode .segment-btn{ background:rgba(255,255,255,.05); border-color:var(--border); color:var(--text-muted); }
  body.dark-mode .segment-btn.active{ border-color:var(--violet); color:var(--violet); background:rgba(255,255,255,.09); }

  /* ---------- rainbow mode: extra flair, works in Light or Dark Mode ---------- */
  @keyframes rainbowHueShift{ 0%{ filter:hue-rotate(0deg); } 100%{ filter:hue-rotate(360deg); } }
  @keyframes rainbowGlow{
    0%,100%{ box-shadow:0 0 0 1px rgba(255,127,196,.55), 0 8px 30px -10px rgba(255,127,196,.4); }
    16%{ box-shadow:0 0 0 1px rgba(255,178,89,.55), 0 8px 30px -10px rgba(255,178,89,.4); }
    33%{ box-shadow:0 0 0 1px rgba(255,224,107,.55), 0 8px 30px -10px rgba(255,224,107,.4); }
    50%{ box-shadow:0 0 0 1px rgba(95,224,183,.55), 0 8px 30px -10px rgba(95,224,183,.4); }
    66%{ box-shadow:0 0 0 1px rgba(112,210,255,.55), 0 8px 30px -10px rgba(112,210,255,.4); }
    83%{ box-shadow:0 0 0 1px rgba(187,158,255,.55), 0 8px 30px -10px rgba(187,158,255,.4); }
  }
  body.rainbow-mode .thread,
  body.rainbow-mode .mini-logo .thread,
  body.rainbow-mode .btn-gold,
  body.rainbow-mode .core-card,
  body.rainbow-mode .core-thread,
  body.rainbow-mode .btile.wild-tile,
  body.rainbow-mode .htile.wild,
  body.rainbow-mode .name-row .dot,
  body.rainbow-mode .loadout-chip .swatch{
    animation:rainbowHueShift 6s linear infinite;
  }
  body.rainbow-mode .switch input:checked + .slider{
    background:var(--rainbow); animation:rainbowHueShift 6s linear infinite;
  }
  body.rainbow-mode .panel{
    animation:rainbowGlow 7s linear infinite;
  }
  body.rainbow-mode .winscreen h1{ animation:winnerTitlePop .6s cubic-bezier(.34,1.56,.64,1), rainbowHueShift 6s linear infinite; }

  /* =====================================================================
     BIGGER TEXT
     Independent of every other setting, and works the same in Light or
     Dark Mode. One scale variable drives font-size everywhere (headings,
     buttons, tiles, chips, modals) plus the letter-tile boxes that need
     to grow along with their text. Rows that hold several tiles/chips
     already wrap (flex-wrap / grid), so the extra size just pushes
     overflow items down onto a new line instead of shrinking or
     spilling off screen.
     ===================================================================== */
  body.big-text{ --text-scale:1.5; }
  body.big-text .letterpicker{ grid-template-columns:repeat(4,1fr); }
  body.big-text .btn{ padding:16px 20px; }
  body.big-text .panel{ padding:20px; }
  body.big-text .btn-row{ flex-wrap:wrap; row-gap:8px; }
  body.big-text .btn-row button{ flex:1 1 calc(50% - 4px) !important; }
  body.big-text .row-header{ flex-wrap:wrap; }
  body.big-text .word-status{
    flex:1 1 100%; width:100%; text-align:left; white-space:normal;
    overflow:visible; text-overflow:clip; line-height:1.5; margin-top:2px;
  }
  /* The gate ("pass the device" / "CPU is thinking") screen already has a
     large emoji plus a name heading — scaling both by the full text-scale
     factor pushes the emoji (and the button below it) off a small phone
     screen. Cap the name text growth here so the emoji keeps its full,
     clearly-legible size and everything still fits in one view. */
  body.big-text .gate .thread-icon{ margin-bottom:10px; }
  body.big-text .gate h2{ font-size:calc(24px * 1.15); }
  body.big-text .gate-name{ font-size:calc(34px * 1.15); margin-bottom:10px; }
  body.big-text .gate p{ font-size:calc(14px * 1.15); margin-bottom:16px; }
  body.big-text .cpu-toggle{ font-size:calc(11px * 1.2); }
  body.big-text .name-row{ gap:6px; }

  /* =====================================================================
     HIGH CONTRAST
     Independent of Light/Dark Mode — flattens every translucent surface
     to a solid, deeply-saturated colour, swaps in bold black/white
     borders everywhere, and drops the blur so every edge stays crisp.
     ===================================================================== */
  body.high-contrast .panel,
  body.high-contrast .modal,
  body.high-contrast .btn-outline,
  body.high-contrast .name-row input,
  body.high-contrast .feedback-textarea,
  body.high-contrast .stepper button,
  body.high-contrast .loadout-chip,
  body.high-contrast .status-chip,
  body.high-contrast .toast,
  body.high-contrast .letterpicker button,
  body.high-contrast .segment-btn{
    border-width:3px;
  }
  body.high-contrast .panel{ backdrop-filter:none; }
  body.high-contrast .segment-btn{ background:var(--panel); color:var(--text); border-color:var(--border); }
  body.high-contrast .segment-btn.active{ border-color:var(--violet); color:var(--violet); }
  body.high-contrast .htile, body.high-contrast .btile{ border-width:4px; box-shadow:none; }
  body.high-contrast .core-card{ border-width:4px; }
  body.high-contrast .btn{ font-weight:800; }
  body.high-contrast .switch .slider{ border:2px solid var(--border); }
  body.high-contrast .switch .slider::before{ box-shadow:0 0 0 2px var(--border); }

  /* ---- light + high contrast: black on white, no soft gradients ---- */
  body.high-contrast:not(.dark-mode){
    --ink:#000000;
    --panel:#FFFFFF;
    --panel-2:#FFFFFF;
    --tile:#FFFFFF;
    --tile-ink:#000000;
    --pink:#C2185B;
    --orange:#B45300;
    --yellow:#7A5D00;
    --mint:#0B7A54;
    --sky:#0B5FA5;
    --violet:#4C1D95;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet);
    --teal:var(--sky);
    --brick:#B3122B;
    --sage:#146B45;
    --text:#000000;
    --text-muted:#3A3A3A;
    --line:#000000;
    --border:#000000;
    background:#FFFFFF;
  }
  body.high-contrast:not(.dark-mode) .panel{ background:#FFFFFF; box-shadow:none; }
  body.high-contrast:not(.dark-mode) .btn-outline{ background:#FFFFFF; }
  body.high-contrast:not(.dark-mode) .btn-outline:hover{ background:#F0F0F0; }
  body.high-contrast:not(.dark-mode) .name-row input{ background:#FFFFFF; }
  body.high-contrast:not(.dark-mode) .feedback-textarea{ background:#FFFFFF; }
  body.high-contrast:not(.dark-mode) .stepper button{ background:#FFFFFF; }
  body.high-contrast:not(.dark-mode) .loadout-chip{ background:#FFFFFF; }
  body.high-contrast:not(.dark-mode) .status-chip{ background:#FFFFFF; }
  body.high-contrast:not(.dark-mode) .toast{ background:#FFFFFF; box-shadow:none; }
  body.high-contrast:not(.dark-mode) .letterpicker button{ background:#FFFFFF; }
  body.high-contrast:not(.dark-mode) .modal-backdrop{ background:rgba(0,0,0,.75); }
  body.high-contrast:not(.dark-mode) .modal{ background:#FFFFFF; box-shadow:none; }

  /* ---- dark + high contrast: white on true black ---- */
  body.dark-mode.high-contrast{
    --ink:#FFFFFF;
    --panel:#000000;
    --panel-2:#000000;
    --tile:#FFFFFF;
    --tile-ink:#000000;
    --pink:#FF8FCB;
    --orange:#FFC178;
    --yellow:#FFEB7A;
    --mint:#7FF0C7;
    --sky:#8FDBFF;
    --violet:#D2B8FF;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet);
    --teal:var(--sky);
    --brick:#FF9CAE;
    --sage:#7FF0C0;
    --text:#FFFFFF;
    --text-muted:#E2E2E2;
    --line:#FFFFFF;
    --border:#FFFFFF;
    background:#000000;
  }
  body.dark-mode.high-contrast .panel{ background:#000000; box-shadow:none; }
  body.dark-mode.high-contrast .btn-outline{ background:#000000; }
  body.dark-mode.high-contrast .btn-outline:hover{ background:#161616; }
  body.dark-mode.high-contrast .name-row input{ background:#000000; }
  body.dark-mode.high-contrast .feedback-textarea{ background:#000000; }
  body.dark-mode.high-contrast .stepper button{ background:#000000; }
  body.dark-mode.high-contrast .loadout-chip{ background:#000000; }
  body.dark-mode.high-contrast .status-chip{ background:#000000; }
  body.dark-mode.high-contrast .toast{ background:#000000; box-shadow:none; }
  body.dark-mode.high-contrast .letterpicker button{ background:#000000; }
  body.dark-mode.high-contrast .modal-backdrop{ background:rgba(255,255,255,.15); }
  body.dark-mode.high-contrast .modal{ background:#000000; box-shadow:none; }

  /* ===================================================================
     COLORBLIND MODE — swaps the 8-color palette (used for player
     colors, the rainbow core-card, and semantic good/bad accents like
     the success glow and error shake) for a colorblind-safe set based
     on the Okabe-Ito palette, so all 8 hues stay distinguishable under
     protanopia, deuteranopia, and tritanopia. Independent of dark mode
     and high contrast, same pattern as those toggles — two variants,
     one per background lightness, since a color that reads clearly on
     white can wash out on black and vice versa.
     ===================================================================== */
  body.colorblind-mode:not(.dark-mode){
    --pink:#CC79A7;
    --orange:#E69F00;
    --yellow:#B8960A;
    --mint:#009E73;
    --sky:#56B4E9;
    --violet:#0072B2;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet);
    --teal:var(--sky);
    --brick:#D55E00;
    --sage:#1A1A1A;
  }
  body.dark-mode.colorblind-mode{
    --pink:#E3A6C9;
    --orange:#FFB84D;
    --yellow:#F0E442;
    --mint:#3DDBB0;
    --sky:#7EC8F2;
    --violet:#5AB4E0;
    --rainbow:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--mint),var(--sky),var(--violet));
    --gold:var(--violet);
    --teal:var(--sky);
    --brick:#FF8B4D;
    --sage:#E6E6E6;
  }
</style>

<body>

<div id="app"></div>

<script>
/* ============================= DATA ============================= */

// Dictionary: 80372 valid English words, 3-8 letters (max possible word length: 7-card hand + 1 Core Card).
// Source: ENABLE (Enhanced North American Benchmark LExicon), a public-domain word list
// (https://github.com/dolph/dictionary) with ~99% overlap with the official NASPA/TWL
// tournament dictionary. Chosen over TWL/Collins Scrabble Words since both require a paid
// commercial license to redistribute; ENABLE is free and safe to ship in a public app.
// Supplemented with ~100 UK-spelling variants (colour/-ise/-re/-ogue/double-L forms etc.)
// not already in ENABLE, generated from known British spelling-transformation rules and

/* ============================= ONLINE MULTIPLAYER SETUP =============================
   To let people play on their own phones (instead of passing one device around),
   this game can sync through a Firebase Firestore project. Steps:

     1. https://console.firebase.google.com -> "Add project" -> any name is fine
        (Analytics can be turned off). Finish the wizard.
     2. Left sidebar -> Build -> Firestore Database -> Create database ->
        "Start in test mode" -> pick any region.
     3. Left sidebar -> gear icon -> Project settings -> scroll to "Your apps" ->
        click the </> (web) icon -> give it any nickname -> skip Hosting.
        It will show a `firebaseConfig` object — copy it and paste it in below,
        replacing the placeholder values.
     4. (Recommended — test-mode rules expire after 30 days) In Firestore ->
        Rules, replace the default rules with:
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /rooms/{roomCode} {
                allow read, write: if true;
              }
            }
          }
        This scopes open access to just the `rooms` collection this game uses.
        Anyone who knows a room's 4-letter code could read or write that one
        room — fine for a casual game with friends, not meant for anything
        sensitive.
     5. Save this file. "Play Online" will now work.

   Note on privacy: hands are kept private the simple way — this client just
   never displays anyone else's letters — but the full game state (everyone's
   hand included) does live in the shared Firestore document, so a
   technically-inclined player could still inspect it via browser dev tools.
*/
const firebaseConfig = {
  apiKey: "AIzaSyDfj8D_WmpZHdy6U1TWkvOsXLciUFvU1QQ",
  authDomain: "endlinkonline.firebaseapp.com",
  projectId: "endlinkonline",
  storageBucket: "endlinkonline.firebasestorage.app",
  messagingSenderId: "183476461533",
  appId: "1:183476461533:web:14338d4e1d7eb7cead6034"
};
let db = null;
let FIREBASE_CONFIGURED = false;
try{
  // `firebase` comes from the two gstatic.com <script> tags above — if
  // those fail to load (offline, blocked CDN, flaky network), `firebase`
  // is undefined and referencing it throws. Local pass-and-play and Daily
  // Challenge don't need Firebase at all, so a failure here should only
  // disable online features (handled via FIREBASE_CONFIGURED/db being left
  // false/null below), never take down the whole app.
  if(typeof firebase !== "undefined" && firebaseConfig.apiKey !== "REPLACE_WITH_YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    FIREBASE_CONFIGURED = true;
  }
}catch(e){
  console.error("Firebase init failed — online features disabled:", e);
  db = null;
  FIREBASE_CONFIGURED = false;
}

/* ============================= PLAYTESTING ANALYTICS =====================
   Lightweight, fire-and-forget event log written to its own Firestore
   collection — separate from the "rooms" collection used for live online
   game sync, so it doesn't interfere with or get cleaned up alongside game
   state. Works in BOTH local pass-and-play and online modes, since `db` is
   initialized unconditionally above regardless of which mode is played.

   Design notes:
   - Never blocks or slows down gameplay: writes are async and any failure
     (offline, permissions, etc.) is silently swallowed.
   - Respects the Analytics toggle in Settings (opt-out, on by default) —
     when off, logEvent() is a no-op.
   - Every event carries a per-game sessionId (regenerated at the start of
     each game) so events can be grouped into a single game/session later,
     plus the play mode and whether Clock mode was active.
   - See /mnt/user-data/outputs/analytics-dashboard.html for the companion
     read-only dashboard that queries and charts this collection.
============================================================================ */
let analyticsSessionId = null;
function newAnalyticsSession(){
  analyticsSessionId = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  return analyticsSessionId;
}
function logEvent(name, payload){
  if(!state.analyticsEnabled || !db) return;
  try{
    db.collection("analytics_events").add(Object.assign({
      event: name,
      session: analyticsSessionId || newAnalyticsSession(),
      mode: state.mode,
      clockMode: !!state.clockMode,
      playerCount: state.players ? state.players.length : null,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    }, payload || {})).catch(()=>{ /* analytics failures must never affect gameplay */ });
  }catch(e){ /* ignore — e.g. Firestore SDK not ready yet */ }
}
// Buckets where the required (core) letter ended up within a played word —
// "did people actually use the 'anywhere in the word' rule, or just tack it
// on the front out of habit?"
function corePositionBucket(coreIdx, wordLen){
  if(coreIdx <= 0) return "start";
  if(coreIdx >= wordLen - 1) return "end";
  return "middle";
}

// The target score scales with table size: 2-player games (including Daily
// Challenge) target 40; everything larger targets (players + 1) * 10.
// Chosen from simulation data — a flat target across every player count made
// round count *shrink* as more players joined (bigger round-end bonuses from
// more opponents reach a fixed target faster), so big tables felt rushed
// relative to a 1v1. Scaling the target keeps round count roughly level
// (~3-5 rounds) regardless of how many are playing.
function winningScore(playerCount){
  const n = playerCount || 2;
  return n === 2 ? 40 : (n + 1) * 10;
}

  const n = (state.players && state.players.length) ? state.players.length : (state.playerCount || 2);
  return winningScore(n);
}

/* --- Chimes & alerts --------------------------------------------------
   Three distinct WebAudio chimes, all played on a single persistent
   AudioContext that's unlocked by the player's very first tap on the page
   (see the "unlockAudioOnce" listener below). Browsers only allow an
   AudioContext to start/resume as a direct result of a user gesture — a
   turn/round/game change arriving later via the Firestore listener isn't
   one — so a fresh AudioContext created at that moment would stay silently
   suspended forever. Reusing one that was already unlocked earlier
   sidesteps that: once "running", it stays usable for any future sound.
     - playTurnChime: two quick ascending notes — fired once per transition
       into isMyTurn===true (see renderOnlinePlay)
     - playRoundEndChime: a slightly longer three-note phrase — fired once
       per transition into the roundEnd screen
     - playGameEndChime: a four-note ascending fanfare — fired once per
       transition into the gameOver screen
   (edge-detection for the latter two lives in render(), via lastChimeScreen)
------------------------------------------------------------------------- */
let wasMyOnlineTurn = false;
let lastChimeScreen = null;
let titleFlashTimer = null;
const ORIGINAL_TITLE = document.title;
let sharedAudioCtx = null;

function unlockAudioOnce(){
  if(sharedAudioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  sharedAudioCtx = new Ctx();
  // Some browsers still hand back a "suspended" context even from a real
  // gesture until resume() is explicitly called on it.
  if(sharedAudioCtx.state === "suspended") sharedAudioCtx.resume();
  document.removeEventListener("pointerdown", unlockAudioOnce);
  document.removeEventListener("keydown", unlockAudioOnce);
}
document.addEventListener("pointerdown", unlockAudioOnce);
document.addEventListener("keydown", unlockAudioOnce);

// notes: array of {freq, at, dur}. `at` and `dur` are in seconds, relative
// to when playback starts. `gain` is peak volume (0-1).
function playNotes(notes, gain){
  try{
    if(!sharedAudioCtx) return; // no gesture has unlocked audio yet
    const ctx = sharedAudioCtx;
    const schedule = ()=>{
      const now = ctx.currentTime;
      notes.forEach(({freq, at, dur})=>{
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const start = now + at;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(gain, start + Math.min(0.02, dur/4));
        g.gain.linearRampToValueAtTime(0, start + dur);
        osc.connect(g).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.02);
      });
    };
    if(ctx.state === "suspended") ctx.resume().then(schedule);
    else schedule();
  }catch(e){ /* audio not available — chime is best-effort */ }
}

function playTurnChime(){

  ], 0.2);
}

}

// Returns the highest-scoring player who has reached this game's target
// score (see winningScore() above), or null.
// Used both at round-end and after ordinary word plays, since a player's
// score can cross the threshold either way (round-end bonus points, or
// plain per-word points on a turn where their hand doesn't empty).
function checkForWinner(){
  const active = state.players.filter(pl => !pl.eliminated);
  if(!active.length) return null;
  const maxScore = Math.max(...active.map(pl => pl.score));
  if(maxScore < winningScore(state.players.length)) return null;
  const tied = active.filter(pl => pl.score === maxScore);
  if(tied.length === 1) return tied[0];

  // Tie at the top: whoever most recently won a round takes it, including
  // the round that just ended (its roundBonus entry is already the newest
  // thing in the log by the time this runs). Scan newest-first.
  if(state.wordLog){
    for(let i = state.wordLog.length - 1; i >= 0; i--){
      const entry = state.wordLog[i];
      if(entry.type === "roundBonus"){
        const match = tied.find(pl => pl.name === entry.by);
        if(match) return match;
      }
    }
  }
  // No round-win history to break the tie by (shouldn't normally happen) —
  // fall back to the first tied player rather than leaving it undecided.
  return tied[0];
}

let uid = 0;
function nextId(){ return uid++; }

// A tiny seedable PRNG (mulberry32) + string-to-seed hash, used only by
// Daily Challenge mode so every player gets an identical shuffled deck (and
// the CPU makes identical tie-break choices) on a given calendar date.
// Every other mode still uses the browser's real Math.random via the
// default parameter below — nothing changes for local/online play.
function seedFromString(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todayDateString(){
  return new Date().toISOString().slice(0, 10); // YYYY-MM-DD, UTC — same puzzle worldwide
}

function buildDeck(rng){
  let cards = [];
  for(const letter in LETTER_DISTRIBUTION){
    for(let i=0;i<LETTER_DISTRIBUTION[letter];i++){
      cards.push({ id: nextId(), kind:"letter", letter });
    }
  }
  return shuffle(cards, rng);
}

function shuffle(arr, rng){
  rng = rng || Math.random;
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* ============================= GAME SETUP ============================= */

/* ============================= DAILY CHALLENGE =============================
   A 1-human-vs-1-CPU game with a deterministic, date-seeded deck so every
   player gets the identical starting hands, wildcards, and Core Card on a
   given day. Reuses the entire normal local-game screen flow (gate/play/
   round-end) — "daily" behaves exactly like "local" everywhere else in the
   app, since every other state.mode check in the codebase is specifically
   `=== "online"` (with everything else falling into the same local-style
   branch). The only daily-specific pieces are: seeding dealRound()/the AI's
   word tie-breaking (above), gating one attempt per day, and — once the
   game ends — posting the net score and showing today's percentile instead
   of the normal win screen.

   Known limitation: the human and CPU draw from ONE shared seeded deck
   (matching how a normal 2-player game already works), so if two different
   people play very differently — drawing a different number of bonus cards
   at different points — the CPU can end up seeing slightly different card
   draws deeper into the game, even though everyone's *starting* hands, the
   starting Core Card, and the CPU's decision-making logic are identical.
   In practice this is a fairly small effect (a card or two of drift), and
   fixing it fully would mean giving the CPU its own separate seeded card
   supply — a bigger change than made sense for a first version of this. */
function dailyAlreadyPlayedToday(){
  try{ return localStorage.getItem("endlink_daily_last_played") === todayDateString(); }
  catch(e){ return false; }
}
function getStoredDailyResult(){
  try{
    const raw = localStorage.getItem("endlink_daily_last_result");
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function storeDailyResult(result){
  try{
    localStorage.setItem("endlink_daily_last_played", todayDateString());
    localStorage.setItem("endlink_daily_last_result", JSON.stringify(result));
  }catch(e){ /* ignore */ }
}
function getFeedbackName(){

  catch(e){ return ""; }
}
function setFeedbackName(name){
  try{ localStorage.setItem("endlink_feedback_name", name); }catch(e){ /* ignore */ }
}

/* ---- Lifetime Daily Challenge stats ----------------------------------
   Purely local (localStorage), one entry per calendar day played, keyed
   by date so a duplicate submit for the same day overwrites rather than
   double-counts. Everything in the stats popup is derived from this
   history — nothing here depends on Firestore, so stats still work even
   if the leaderboard/percentile fetch fails. */
function getDailyStatsHistory(){
  try{
    const raw = localStorage.getItem("endlink_daily_stats");
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function recordDailyStatsEntry(entry){
  try{
    const history = getDailyStatsHistory().filter(e => e.date !== entry.date);
    history.push(entry);
    history.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    localStorage.setItem("endlink_daily_stats", JSON.stringify(history));
  }catch(e){ /* ignore */ }
}
/* Refreshes just the percentile on an already-recorded day, leaving its
   netScore/longestWord/eightLetterWords alone — used when someone revisits
   a day's result later on (state.wordLog from that round is long gone by
   then, so there's nothing else to recompute) and the percentile has moved
   since more people played. No-ops if that day was never recorded, or if
   the fresh fetch didn't come back with a number. */
function updateDailyStatsPercentile(date, percentile){
  if(percentile == null) return;
  const entry = getDailyStatsHistory().find(e => e.date === date);
  if(entry) recordDailyStatsEntry(Object.assign({}, entry, { percentile }));
}
function isNextCalendarDay(a, b){
  return (new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) === 86400000;
}
function computeDailyStatsSummary(){
  const history = getDailyStatsHistory();
  if(!history.length){
    return { gamesPlayed:0, gamesWon:0, gamesWonPct:0, totalPoints:0, longestStreak:0, avgPoints:0, bestNetScore:null, eightLetterWordCount:0, mostRecentLongestWord:"" };
  }
  const dates = history.map(e => e.date).sort();

  let longestStreak = 1, run = 1;
  for(let i=1;i<dates.length;i++){
    run = isNextCalendarDay(dates[i-1], dates[i]) ? run + 1 : 1;
    longestStreak = Math.max(longestStreak, run);
  }

  const gamesWon = history.filter(e => typeof e.netScore === "number" && e.netScore > 0).length;
  const gamesWonPct = Math.round((gamesWon / history.length) * 100);

  const netScores = history.map(e => e.netScore).filter(n => typeof n === "number");
  const bestNetScore = netScores.length ? Math.max(...netScores) : null;

  // humanScore only exists on entries recorded after this stat was added —
  // older entries are simply excluded rather than treated as zero.
  const pointScores = history.map(e => e.humanScore).filter(n => typeof n === "number");
  const totalPoints = pointScores.reduce((a,b) => a+b, 0);
  const avgPoints = pointScores.length ? totalPoints / pointScores.length : 0;

  const eightLetterWordCount = history.reduce((sum, e) => sum + (e.eightLetterWords || 0), 0);

  const lastDate = dates[dates.length - 1];
  const mostRecentEntry = history.find(e => e.date === lastDate);
  const mostRecentLongestWord = (mostRecentEntry && mostRecentEntry.longestWord) || "";

  return { gamesPlayed: history.length, gamesWon, gamesWonPct, totalPoints, longestStreak, avgPoints, bestNetScore, eightLetterWordCount, mostRecentLongestWord };
}

/* Shares today's net score. Prefers the native share sheet (navigator.share)
   since that's what lets the link unfurl with the At Last preview image via
   the Open Graph tags in <head> — falls back to copying the text to the
   clipboard on desktop browsers / anywhere Web Share isn't supported. */
async function shareDailyResult(netScore){
  const netLabel = netScore > 0 ? ("+" + netScore) : String(netScore);
  const message = `I scored a net score of ${netLabel} on At Last today! Do you think you can beat my score?`;
  if(navigator.share){
    try{
      await navigator.share({ text: message, url: GAME_URL });
      return;
    }catch(e){
      if(e && e.name === "AbortError") return; // person cancelled the share sheet — not an error
      // fall through to clipboard on any other failure
    }
  }
  const text = `${message} ${GAME_URL}`;
  try{
    await navigator.clipboard.writeText(text);
    showToast("Copied your result to the clipboard!");
  }catch(e){
    showToast("Couldn't copy automatically — long-press to copy: " + text);
  }
}

function startDailyGame(){
  if(dailyAlreadyPlayedToday()){
    state.screen = "dailyResult";
    render();
    return;
  }
  const dateStr = todayDateString();
  state.mode = "daily";
  state.dailyDate = dateStr;
  state.dailyRng = mulberry32(seedFromString("at-last-daily-" + dateStr));
  state.players = [
    { name: "You", hand:[], wildcards:[], score:0, isCPU:false, color:PLAYER_COLORS[0], timeLeft:120, eliminated:false },
    { name:"Computer", hand:[], wildcards:[], score:0, isCPU:true, cpuDifficulty:"native", color:PLAYER_COLORS[1], timeLeft:120, eliminated:false },
  ];
  state.lastRound = null;
  state.nextStarter = 0; // round 1 of a fresh game always starts at seat 0
  state.gameWinner = null;
  state.wordLog = [];
  state.openWordDefs.clear();
  state.roundNum = 0;
  newAnalyticsSession();
  logEvent("game_started", { playerCount:2, cpuCount:1, clockMode:false, mode:"daily" });
  dealRound();
  state.currentPlayer = 0;
  state.screen = "play";
